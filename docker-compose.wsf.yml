# WS-F — fragment de docker-compose (ver CONVENTIONS.md). Conecta à rede
# externa `dse_net` já declarada na fundação (docker-compose.yml). `make up`
# faz o merge de todos os fragments `docker-compose.ws*.yml` presentes.
#
# otel-collector (WSF-E7-T1): recebe spans/métricas OTLP dos outros serviços
# (WS-D instrumenta o lado de quem emite, usando os atributos
# dse_contracts.constants.OTEL_ATTR_*) e exporta para stdout via `debug`
# exporter (nenhum backend de observabilidade real está provisionado nesta
# sessão de dev — ver infra/ALERTING-RULES.md para o que trocar em produção).

networks:
  dse_net:
    external: true
    name: dse_net

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: dse_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks: [dse_net]

  # WSF-E6-T3 — Admin queue board (server-rendered, SEM design system) na 8890.
  # Lê o Postgres (system of record) e envia signals ao Temporal. Login via SSO
  # (WSF-E3-T3) — configure DSE_OIDC_* para plugar o IdP; sem isso o login fica
  # desabilitado (503), apropriado para um deployment ainda sem IdP.
  queue-board:
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    container_name: dse_queue_board
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_PLATFORM_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_AUDIT_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_TEMPORAL_TARGET: temporal:7233
      DSE_CONSOLE_SESSION_SECRET: ${DSE_CONSOLE_SESSION_SECRET:-dev-console-secret-not-for-prod-change-me-32b}
      # Plugar o IdP: DSE_OIDC_ISSUER / DSE_OIDC_AUDIENCE / DSE_OIDC_JWKS(_FILE)
    ports:
      - "8890:8890"
    networks: [dse_net]
