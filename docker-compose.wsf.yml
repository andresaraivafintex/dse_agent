# WS-F — docker-compose fragment (see CONVENTIONS.md). Connects to the
# external network `dse_net` already declared in the foundation
# (docker-compose.yml). `make up` merges every `docker-compose.ws*.yml`
# fragment present.
#
# otel-collector (WSF-E7-T1): receives OTLP spans/metrics from the other
# services (WS-D instruments the emitting side, using the
# dse_contracts.constants.OTEL_ATTR_* attributes) and exports to stdout via the
# `debug` exporter (no real observability backend is provisioned in this dev
# session — see infra/ALERTING-RULES.md for what to swap in production).

networks:
  dse_net:
    external: true
    name: dse_net

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: dse_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks: [dse_net]

  # WSF-E6-T3 — Admin queue board (server-rendered, NO design system) on 8890.
  # Reads Postgres (system of record) and sends signals to Temporal. Login via
  # SSO (WSF-E3-T3) — set DSE_OIDC_* to plug in the IdP; without it login stays
  # disabled (503), which is appropriate for a deployment with no IdP yet.
  # WSF-E2-T3b/WSF-E8-T2 — platform jobs scheduler (Phase 3): scheduled
  # rotation of service secrets (ADR-28) + retention by classification
  # (§12.2). Reuses the SAME queue board image (command override) — P7.
  # Why a Python scheduler in compose (not a CronJob on k3d): see the docstring
  # of dse_platform/jobs_scheduler.py — the secret consumers and the target
  # Postgres live in compose; on real K8s the same module runs as a CronJob
  # with `--once`.
  platform-jobs:
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    container_name: dse_platform_jobs
    command: ["python", "-m", "dse_platform.jobs_scheduler"]
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_PLATFORM_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_AUDIT_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      VAULT_ADDR: http://vault:8200
      # Local dev ONLY (the foundation's dev-mode Vault). Production: a
      # VAULT_TOKEN from a dedicated policy (rotate + read/write on
      # dse/service/* only).
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dse_dev_root}
      DSE_ROTATION_INTERVAL_SECONDS: "86400"
      DSE_RETENTION_INTERVAL_SECONDS: "86400"
      # Internal service secrets rotatable without an external provider API.
      # Slack/GitHub/Jira go in here once there are real apps (per-provider
      # generator — see dse_platform/secret_rotation.py).
      DSE_ROTATION_MANIFEST: '[{"path": "dse/service/queue-board-session", "tenant_id": "platform"}]'
    networks: [dse_net]

  queue-board:
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    container_name: dse_queue_board
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_PLATFORM_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_AUDIT_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_TEMPORAL_TARGET: temporal:7233
      DSE_CONSOLE_SESSION_SECRET: ${DSE_CONSOLE_SESSION_SECRET:-dev-console-secret-not-for-prod-change-me-32b}
      # To plug in the IdP: DSE_OIDC_ISSUER / DSE_OIDC_AUDIENCE / DSE_OIDC_JWKS(_FILE)
    ports:
      - "8890:8890"
    networks: [dse_net]
