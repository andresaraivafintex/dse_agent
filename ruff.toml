# Config for the blocking lint gate (make lint / CI quality job).
# Surgical ignores for DELIBERATE patterns in this repo — never a broad ignore:
# - __init__.py: public API re-exports (F401 is the pattern, not an oversight).
# - sandbox-runtime's activities.py and orchestrator's fakes.py: non-top-level
#   imports are intentional (avoiding import cycles and import cost in the
#   worker; see the comments in the files themselves).

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"services/sandbox-runtime/sandbox_runtime/activities.py" = ["E402"]
"services/sandbox-runtime/tests/test_coder_prune_disposable.py" = ["E402"]
"services/orchestrator/tests/fakes.py" = ["E402"]
