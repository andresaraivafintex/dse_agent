[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-validation"
version = "0.1.0"
description = "WS-E: pipeline L1 (lint/typecheck/test/build + SAST/secret-scan + diff-budget), PR finalizer idempotente, consumo de status de CI, resume por review comment (Fintex DSE Fase 1)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "temporalio>=1.7",
    "psycopg2-binary>=2.9",
    "bandit>=1.7",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "dse-contracts",
    "dse-audit",
    "dse-identity",
]

[tool.setuptools.packages.find]
include = ["dse_validation*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff", "mypy"]
