# WSE-E5-T12 — Garage (self-hosted S3 artifact store), single-node DEV layout.
# Production: multi-node with replication_factor >= 2 and secrets via Vault/ESO —
# this file is the local analogue (same discipline as the foundation's dev-mode vault).
# The rpc_secret/admin_token below are DEV-ONLY (local repo), not real secrets.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "1b118d7bd7e105f2245538126c080fc70e90221d443bfb1a445e029af3fee904"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "dse_garage_admin_dev"
metrics_token = "dse_garage_metrics_dev"
