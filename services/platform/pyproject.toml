[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-platform"
version = "0.1.0"
description = "WS-F: plataforma, segurança, compliance e operações do Fintex DSE (Fase 1)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "hvac>=2.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
    "dse-audit",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dse_secrets*", "dse_platform*"]
