[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-platform"
version = "0.1.0"
description = "WS-F: Fintex DSE platform, security, compliance and operations (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "hvac>=2.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "dse-audit",
]

[project.optional-dependencies]
# temporalio: real signal sending from the queue board (WSF-E6-T2). Optional
# because the tests use FakeSignalSender; install it for the real TemporalSignalSender.
temporal = ["temporalio>=1.7"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dse_secrets*", "dse_platform*"]
