# Fintex DSE — WS-D — Config do LiteLLM proxy (model-gateway).
#
# Version pinning: ver docker-compose.wsd.yml na raiz do repo — a imagem é
# fixada por DIGEST (não por tag "main-latest"), para que "upgrade" seja um
# ato explícito (trocar o digest + rodar scripts/smoke_test.py antes de subir
# em qualquer ambiente compartilhado). Ver README.md §"Version pinning e
# upgrade simulado" para o procedimento completo.
#
# Dois tiers de model registrados:
#   1. `bedrock/*`  — tier de produção via AWS Bedrock por VPC PrivateLink.
#      Não há conta AWS disponível nesta sessão de desenvolvimento — os
#      valores abaixo são PLACEHOLDERS documentando exatamente a forma
#      esperada da config real (ver README).
#   2. `eco/echo-model` — tier local/dev: um provider "custom" real, apontando
#      para o echo_provider/server.py (processo HTTP próprio, sem custo, sem
#      dependência externa), registrado como um provider OpenAI-compatível
#      qualquer (o mesmo mecanismo usado para vLLM/Ollama/etc. em produção).
#      Permite testar o gateway fim-a-fim sem nenhuma credencial paga.

model_list:
  # --- Tier 1: Bedrock / PrivateLink (produção — placeholders, ver README) ---
  - model_name: bedrock/anthropic.claude-3-5-sonnet
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_region_name: os.environ/DSE_AWS_REGION
      # VPC endpoint da PrivateLink para bedrock-runtime — substituir pelo ID
      # real provisionado pelo time de infra (WS-F/plataforma AWS do cliente).
      aws_bedrock_runtime_endpoint: os.environ/DSE_BEDROCK_PRIVATELINK_ENDPOINT
      # IAM role assumida pelo gateway (via IRSA/web-identity se em EKS, ou
      # instance profile se em EC2) — nunca uma access key estática.
      aws_role_name: os.environ/DSE_BEDROCK_IAM_ROLE_ARN
      aws_web_identity_token: os.environ/AWS_WEB_IDENTITY_TOKEN_FILE
    model_info:
      dse_tier: 1
      dse_requires_infra: "aws_bedrock_privatelink"

  - model_name: bedrock/anthropic.claude-3-haiku
    litellm_params:
      model: bedrock/anthropic.claude-3-haiku-20240307-v1:0
      aws_region_name: os.environ/DSE_AWS_REGION
      aws_bedrock_runtime_endpoint: os.environ/DSE_BEDROCK_PRIVATELINK_ENDPOINT
      aws_role_name: os.environ/DSE_BEDROCK_IAM_ROLE_ARN
      aws_web_identity_token: os.environ/AWS_WEB_IDENTITY_TOKEN_FILE
    model_info:
      dse_tier: 1
      dse_requires_infra: "aws_bedrock_privatelink"

  # --- Tier local/dev: modelo eco, funcional agora, sem custo ---
  - model_name: eco/echo-model
    litellm_params:
      model: openai/echo-model
      api_base: os.environ/DSE_ECHO_PROVIDER_URL
      # Achado da integração da Fase 1 (scanner do WS-F,
      # scripts/scan_for_plaintext_secrets.py): esta era a única entrada do
      # arquivo com valor literal em vez de indireção `os.environ/...` — o
      # echo provider não exige credencial real (não é um secret de
      # verdade), mas por consistência com o resto do arquivo e para o
      # scanner não precisar de uma exceção especial, movida para env var
      # com default não-sensível.
      api_key: os.environ/DSE_ECHO_PROVIDER_API_KEY
      # Fase 3 (WSD-E4-T1): endpoints locais — falha de conexão deve ser
      # detectada RÁPIDO para o failover intra-tier ser determinístico
      # (sem isso, connect-timeouts default de ~10s × retries internos do SDK
      # empurram o failover para além do timeout do cliente).
      timeout: 5
      max_retries: 0
    model_info:
      dse_tier: "local-dev"
      dse_requires_infra: "none"

  # Fase 3 (WSD-E4-T1): segunda instância eco — alvo do failover INTRA-TIER.
  # MESMO dse_tier ("local-dev") do primário, por construção: o teste negativo
  # test_failover_intra_tier.py::test_no_fallback_route_crosses_tier parseia
  # este arquivo e falha o CI se qualquer rota de fallback apontar para um
  # model de tier diferente (NFR-07/P2 — nunca fallback silencioso entre tiers).
  - model_name: eco/echo-model-b
    litellm_params:
      model: openai/echo-model-b
      api_base: os.environ/DSE_ECHO_PROVIDER_B_URL
      api_key: os.environ/DSE_ECHO_PROVIDER_API_KEY
      timeout: 5
      max_retries: 0
    model_info:
      dse_tier: "local-dev"
      dse_requires_infra: "none"

  # PoC (2026-07-21): Anthropic API direta para o teste end-to-end real —
  # o Coder/Planner escrevem código de verdade. A key vem do Vault
  # (secret/dse/model-gateway/providers → anthropic_api_key), injetada como
  # ANTHROPIC_API_KEY no container do gateway no boot (NUNCA em arquivo/git).
  # NOTA DE POSTURA: este é o atalho de PoC — chama a API pública da Anthropic,
  # não o Bedrock/PrivateLink in-VPC (Tier 1 do proposal). Para produção,
  # trocar por bedrock/* (já registrado acima). Documentado, não silencioso.
  - model_name: anthropic/claude
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      dse_tier: "poc-direct-api"
      dse_requires_infra: "anthropic_public_api"

# Fase 3 (WSD-E4-T1): failover intra-tier NATIVO do proxy (router do LiteLLM).
# Declarativo, fora do código dos agentes (P1): se o deployment do primário
# falhar (connection refused / 5xx / timeout), o router tenta o fallback DA
# MESMA LINHA — e somente ele. Não há rota de fallback para bedrock/* aqui
# (cruzaria o tier contratado) nem haverá: ver teste negativo citado acima.
# O cliente detecta a degradação pelo header x-litellm-attempted-fallbacks
# (>0) + x-litellm-model-api-base, e emite o audit row de degradação (P8) —
# ver model_gateway_client/failover.py.
router_settings:
  num_retries: 1
  # cooldown curto: depois de uma falha o deployment primário volta a ser
  # tentado quase imediatamente — os testes de chaos sobem/derrubam o
  # primário e precisam de recuperação rápida e determinística.
  cooldown_time: 1
  allowed_fails: 1
  fallbacks:
    - eco/echo-model: ["eco/echo-model-b"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Sem `database_url`: o LiteLLM guarda virtual keys em memória do processo
  # (perdidas em restart do container). Aceitável para Fase 1 local — ver
  # README para o plano de produção (Postgres dedicado, NUNCA o schema
  # compartilhado `dse` usado pelo control-plane).
  allow_requests_on_db_unavailable: true

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 30
  # Plano 08 §F (F2) — pre-call hook SERVER-SIDE de budget + kill-switch. Roda
  # DENTRO do proxy (não-bypassável): toda chamada passa por
  # DseBudgetKillSwitchHook.async_pre_call_hook, que lê X-Dse-Tenant-Id/
  # X-Dse-Work-Item-Id e recusa (402 budget / 403 kill-switch) contra o Postgres
  # do control-plane (DSE_DATABASE_URL). Espelha o enforce_call do client (defesa
  # em profundidade). O módulo é montado em /app/dse_budget_hook.py (compose).
  callbacks: ["dse_budget_hook.proxy_handler_instance"]
