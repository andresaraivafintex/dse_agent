# Tier-2 evaluation suite for the model-gateway (WSD-E5-T1). Owner: WS-D.
#
# Every case has:
#   id          — stable identifier
#   model       — LiteLLM alias (model_name from litellm_config.yaml)
#   messages    — OpenAI-compatible payload sent to the gateway
#   assertions  — list of checks over the response. Supported types
#                 (see runner.py):
#     - equals            {value: "..."}        content == value (exact)
#     - contains          {value: "..."}        value in content
#     - deterministic     {}                     run twice -> same content
#     - tokens_positive   {}                     tokens_in>0 and tokens_out>0
#     - max_cost_usd      {value: 0.01}          cost_usd <= value
#
# Note: the `eco/echo-model` cases rely on the echo provider's known
# deterministic transform (ECHO[<last user message reversed>]) — that is why
# an `equals` assertion is possible and stable. Cases for `bedrock/*` use
# looser assertions (contains/tokens) because a real LLM is not
# byte-deterministic; they are SKIPPED automatically when the AWS infra is
# unavailable (see runner.py).

cases:
  - id: echo-determinism
    model: eco/echo-model
    messages:
      - role: user
        content: "reference prompt one"
    assertions:
      - type: deterministic
      - type: tokens_positive

  - id: echo-known-transform
    model: eco/echo-model
    messages:
      - role: user
        content: "abc"
    assertions:
      - type: equals
        value: "ECHO[cba]"

  - id: echo-nonempty
    model: eco/echo-model
    messages:
      - role: system
        content: "you are a code assistant"
      - role: user
        content: "summarize the diff"
    assertions:
      - type: contains
        value: "ECHO["
      - type: max_cost_usd
        value: 1.0

  # Reference case for the production tier (Bedrock). SKIPPED without AWS.
  - id: bedrock-sonnet-smoke
    model: bedrock/anthropic.claude-3-5-sonnet
    messages:
      - role: user
        content: "Reply with the single word: ok"
    assertions:
      - type: tokens_positive
