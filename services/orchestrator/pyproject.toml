[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-orchestrator"
version = "0.1.0"
description = "WS-B: worker Temporal + WorkItemLifecycleWorkflow (maquina de estados do WorkItem) do Fintex DSE"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7,<2",
    "pydantic>=2.6",
    "psycopg2-binary>=2.9",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "dse-contracts",
    "dse-audit",
    "dse-identity",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dse_orchestrator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
