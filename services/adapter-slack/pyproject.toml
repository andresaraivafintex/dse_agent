[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-adapter-slack"
version = "0.1.0"
description = "WS-A: adapter Slack (inbound Events API + outbound status message via MutableCommentWriter)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "slack_sdk>=3.27",
    "dse-contracts",
    "dse-audit",
    "dse-identity",
    "dse-ingest-gateway",
]

[tool.setuptools.packages.find]
include = ["adapter_slack*"]
