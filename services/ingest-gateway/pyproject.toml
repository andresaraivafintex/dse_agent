[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-ingest-gateway"
version = "0.1.0"
description = "WS-A: gateway transacional (outbox), dispatcher Temporal, defesas de intake (assinatura/TOCTOU/sanitização), correlação Path A/B e steering allowlist"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "psycopg2-binary>=2.9",
    "temporalio>=1.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "dse-contracts",
    "dse-audit",
    "dse-identity",
]

[tool.setuptools.packages.find]
include = ["ingest_gateway*"]
