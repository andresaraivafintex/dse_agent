[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-egress-proxy"
version = "0.1.0"
description = "WS-C: default-deny egress proxy with ephemeral credential injection (allowlist derived from the WorkItem)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    # `PyJWT[crypto]`, not bare PyJWT. RS256 — which is the only algorithm a
    # GitHub App JWT can use — lives in `cryptography`, and without it PyJWT
    # raises NotImplementedError at encode time. The broker catches that, falls
    # back to a fixture token, and the relay then goes out anonymous: a private
    # repo stays unclonable with nothing in the logs but a generic 401. Found by
    # minting a token inside the running Pod, not by reading the manifest.
    "PyJWT[crypto]>=2.8",
    "psycopg2-binary>=2.9",
    "dse-contracts",
    "dse-audit",
]

[tool.setuptools.packages.find]
include = ["egress_proxy*"]
