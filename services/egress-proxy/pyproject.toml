[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-egress-proxy"
version = "0.1.0"
description = "WS-C: default-deny egress proxy with ephemeral credential injection (allowlist derived from the WorkItem)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "psycopg2-binary>=2.9",
    "dse-contracts",
    "dse-audit",
]

[tool.setuptools.packages.find]
include = ["egress_proxy*"]
