# Explicit overlay for local development. Keeps the conveniences of the base
# values.yaml and must never be used as input to a pilot release.
deploymentProfile: development

runtime:
  inProcess: true
  localFallbackAllowed: true
  agentSubstrate: fixture

modelGateway:
  allowFixture: true

orchestrator:
  workerVersioning:
    enabled: false
    buildId: dev
