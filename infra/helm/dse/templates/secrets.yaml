{{/*
Vault/ESO wiring (WSF-E2-T3a/platform service). Two supported strategies,
selected through `.Values.secrets.externalSecrets.enabled`:

  1. false (dev/staging with no ESO installed): a "dumb" K8s Secret is created
     here out of `.Values.postgres.auth.password` etc. — acceptable only for
     disposable environments; production MUST be (2).
  2. true (production, ESO installed in the cluster): an ExternalSecret fetches
     the real values from the customer's Vault through the SecretStore
     `secrets.vaultAddr`/`secretStoreRef` — no secret value goes through
     `helm install`/values.yaml in this mode.
*/}}
{{- if .Values.postgres.auth.existingSecret }}
{{- /* Secret managed outside this chart; no sensitive material is rendered. */ -}}
{{- else if not .Values.secrets.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dse.postgresSecretName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  DSE_DATABASE_URL: "postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "dse.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
{{- else }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dse.fullname" . }}-postgres-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "dse.postgresSecretName" . }}
  data:
    - secretKey: DSE_DATABASE_URL
      remoteRef:
        key: {{ default (printf "dse/%s/postgres" .Values.tenant.id) .Values.secrets.externalSecrets.remoteKey | quote }}
        property: "database_url"
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ default (printf "dse/%s/postgres" .Values.tenant.id) .Values.secrets.externalSecrets.remoteKey | quote }}
        property: "username"
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ default (printf "dse/%s/postgres" .Values.tenant.id) .Values.secrets.externalSecrets.remoteKey | quote }}
        property: "password"
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ default (printf "dse/%s/postgres" .Values.tenant.id) .Values.secrets.externalSecrets.remoteKey | quote }}
        property: "database"
{{- end }}
