{{/*
Wiring Vault/ESO (WSF-E2-T3a/serviço de plataforma). Duas estratégias
suportadas, escolhidas via `.Values.secrets.externalSecrets.enabled`:

  1. false (dev/staging sem ESO instalado): um Secret K8s "burro" é criado
     aqui a partir de `.Values.postgres.auth.password` etc. — aceitável só
     para ambientes descartáveis; produção DEVE ser (2).
  2. true (produção, ESO instalado no cluster): um ExternalSecret busca os
     valores reais do Vault do cliente via SecretStore `secrets.vaultAddr`/
     `secretStoreRef` — nenhum valor de secret passa pelo `helm install`/
     values.yaml neste modo.
*/}}
{{- if .Values.postgres.auth.existingSecret }}
{{- /* Secret gerenciado fora deste chart; nenhum material sensível renderizado. */ -}}
{{- else if not .Values.secrets.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dse.postgresSecretName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  DSE_DATABASE_URL: "postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "dse.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
{{- else }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dse.fullname" . }}-postgres-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "dse.postgresSecretName" . }}
  data:
    - secretKey: DSE_DATABASE_URL
      remoteRef:
        key: {{ default (printf "dse/%s/postgres" .Values.tenant.id) .Values.secrets.externalSecrets.remoteKey | quote }}
        property: "database_url"
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ default (printf "dse/%s/postgres" .Values.tenant.id) .Values.secrets.externalSecrets.remoteKey | quote }}
        property: "username"
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ default (printf "dse/%s/postgres" .Values.tenant.id) .Values.secrets.externalSecrets.remoteKey | quote }}
        property: "password"
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ default (printf "dse/%s/postgres" .Values.tenant.id) .Values.secrets.externalSecrets.remoteKey | quote }}
        property: "database"
{{- end }}
