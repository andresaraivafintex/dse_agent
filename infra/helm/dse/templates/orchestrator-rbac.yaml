{{- if .Values.runtime.sandboxRbac.create }}
# RBAC for the orchestrator worker to manage the sandbox Pods (plan 09, K8s
# wiring). DEDICATED identity: only the orchestrator mounts this token (see
# dse.workerPodDefaults); the global SA used by the other workloads stays
# powerless. Least privilege: a NAMESPACED Role in runtime.sandboxNamespace with
# exactly the verbs k8s_driver uses (apply/wait/exec/delete) — no secrets, no
# ClusterRole, no pods/log.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dse.fullname" . }}-orchestrator-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
# The token comes from the orchestrator PodSpec (automountServiceAccountToken:
# true over there), not from this SA's default mount.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dse.fullname" . }}-sandbox-pod-manager
  namespace: {{ .Values.runtime.sandboxNamespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dse.fullname" . }}-sandbox-pod-manager
  namespace: {{ .Values.runtime.sandboxNamespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dse.fullname" . }}-sandbox-pod-manager
subjects:
  # cross-namespace binding: the SA lives in global.namespace, the Role in sandboxNamespace
  - kind: ServiceAccount
    name: {{ include "dse.fullname" . }}-orchestrator-worker
    namespace: {{ .Values.global.namespace }}
{{- end }}
