{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dse.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /slack
            pathType: Prefix
            backend:
              service:
                name: {{ include "dse.fullname" . }}-adapter-slack
                port: { number: {{ .Values.adapters.slack.port }} }
          - path: /github
            pathType: Prefix
            backend:
              service:
                name: {{ include "dse.fullname" . }}-adapter-github
                port: { number: {{ .Values.adapters.github.port }} }
{{- end }}
