{{/*
Adapters (WS-A) + ingest-gateway (WS-A) + validation/PR finalizer (WS-E) —
todos são serviços HTTP simples (webhook receivers), mesmo shape de
Deployment+Service. Secrets de webhook (signing secret Slack, GitHub App
private key) vêm do secrets backend (WSF-E2-T3a) via env var referenciando
um Secret populado por ExternalSecret — nunca hardcoded aqui.
*/}}
{{- if .Values.adapters.slack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}-adapter-slack
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.selectorLabels" (dict "component" "adapter-slack" "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dse.selectorLabels" (dict "component" "adapter-slack" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "adapter-slack" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: adapter-slack
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.adapters.slack.image.repository "tag" .Values.adapters.slack.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.adapters.slack.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "dse.fullname" . }}-config
          env:
            - name: VAULT_ADDR
              value: {{ .Values.secrets.vaultAddr | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-adapter-slack
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "adapter-slack" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.adapters.slack.port }}
      targetPort: {{ .Values.adapters.slack.port }}
      name: http
{{- end }}

