    {{- include "dse.selectorLabels" (dict "component" "adapter-github" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.adapters.github.port }}
      targetPort: {{ .Values.adapters.github.port }}
      name: http
{{- end }}

