{{/*
Vault — only rendered by this chart when `externallyManaged: false` (disposable
dev/staging). In production (topology A, the customer's VPC), Vault must be the
customer's own or a dedicated HA Vault cluster outside this chart — set
`vault.externallyManaged: true` and point `secrets.vaultAddr` at it; this whole
template is then not rendered. `devMode: true` must NEVER be used outside
dev/smoke-test (in-memory data only, automatic unseal, no HA).
*/}}
{{- if and .Values.vault.devMode (not .Values.vault.externallyManaged) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}-vault
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.selectorLabels" (dict "component" "vault" "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dse.selectorLabels" (dict "component" "vault" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "vault" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "dse.podDefaults" . | nindent 6 }}
      containers:
        - name: vault
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.vault.image.repository "tag" .Values.vault.image.tag "digest" .Values.vault.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              # The official Vault image starts as root and su-execs to the vault
              # user (it needs SETUID/SETGID, part of the default caps). Dropping
              # ALL prevents boot. We keep the default caps + IPC_LOCK. The
              # pilot/prod profiles use an EXTERNAL Vault (externallyManaged) —
              # this pod does not come up there, so the relaxation stays confined
              # to dev/POC.
              drop: []
              add: ["IPC_LOCK"]
          ports:
            - containerPort: 8200
              name: http
          env:
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            {{- if .Values.vault.devRootToken }}
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.fullname" . }}-vault-dev-token
                  key: token
            {{- end }}
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-vault
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "vault" "Release" .Release) | nindent 4 }}
  ports:
    - port: 8200
      targetPort: 8200
      name: http
{{- end }}
