{{- if .Values.migrations.enabled }}
# Phase 5 (plan 09): migrations as a hook Job — the deploy is self-sufficient
# (helm upgrade applies the schema BEFORE the new workloads come up). Reuses the
# orchestrator image (which carries scripts/migrate.py + psycopg2) and the same
# Postgres secret; idempotent by design (schema_migrations).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dse.fullname" . }}-migrate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "migrate" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "dse.appPodDefaults" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.orchestrator.image.repository "tag" .Values.orchestrator.image.tag "digest" .Values.orchestrator.image.digest) }}
          securityContext:
            {{- include "dse.appContainerSecurityContext" . | nindent 12 }}
          command: ["python", "scripts/migrate.py"]
          envFrom:
            - configMapRef:
                name: {{ include "dse.fullname" . }}-config
            - secretRef:
                name: {{ include "dse.postgresSecretName" . }}
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
{{- end }}
