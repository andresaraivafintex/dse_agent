{{- if .Values.orchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}-orchestrator
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.selectorLabels" (dict "component" "orchestrator" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      {{- include "dse.selectorLabels" (dict "component" "orchestrator" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "orchestrator" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "dse.workerPodDefaults" . | nindent 6 }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: orchestrator
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.orchestrator.image.repository "tag" .Values.orchestrator.image.tag "digest" .Values.orchestrator.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "dse.appContainerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.orchestrator.healthPort }}
              name: health
          envFrom:
            - configMapRef:
                name: {{ include "dse.fullname" . }}-config
            - secretRef:
                name: {{ include "dse.postgresSecretName" . }}
          env:
            - name: HTTPS_PROXY
              value: "http://{{ include "dse.fullname" . }}-egress-proxy:{{ .Values.egressProxy.port }}"
            - name: HTTP_PROXY
              value: "http://{{ include "dse.fullname" . }}-egress-proxy:{{ .Values.egressProxy.port }}"
            # O API server do K8s (kubectl que cria os Pods de sandbox) tem de
            # ficar FORA do proxy — senão o HTTPS_PROXY sequestra a chamada e o
            # kubectl trava. NO_PROXY usa o ClusterIP que o kubectl MIRA
            # (serviceHost), NÃO o CIDR pós-DNAT da NetworkPolicy.
            - name: NO_PROXY
              value: ".svc,.cluster.local{{ if .Values.networkPolicy.kubeApiServer.serviceHost }},{{ .Values.networkPolicy.kubeApiServer.serviceHost }}{{ end }}"
            # kubectl grava cache de discovery em $HOME/.kube/cache; sob
            # readOnlyRootFilesystem, HOME precisa apontar para o /tmp emptyDir.
            - name: HOME
              value: "/tmp"
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          volumeMounts:
            {{- include "dse.appTmpMount" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: {{ .Values.orchestrator.healthPort }} }
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.orchestrator.healthPort }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.orchestrator.healthPort }} }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-orchestrator
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "orchestrator" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.orchestrator.healthPort }}
      targetPort: {{ .Values.orchestrator.healthPort }}
      name: health
{{- end }}
