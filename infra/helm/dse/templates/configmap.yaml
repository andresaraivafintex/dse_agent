{{- $allowHosts := list -}}
{{- range .Values.egressProxy.allowlist -}}
  {{- $allowHosts = append $allowHosts (printf "%s:%d" .host (int .port)) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dse.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
data:
  DSE_DEPLOYMENT_PROFILE: {{ ternary "dev" "production" (eq .Values.deploymentProfile "development") | quote }}
  DSE_TENANT_ID: {{ .Values.tenant.id | quote }}
  DSE_DATA_CLASS: {{ .Values.tenant.dataClass | quote }}
  DSE_DATABASE_HOST: {{ include "dse.fullname" . }}-postgres
  DSE_DATABASE_PORT: "5432"
  DSE_DATABASE_NAME: {{ .Values.postgres.auth.database | quote }}
  DSE_TEMPORAL_HOST: {{ include "dse.fullname" . }}-temporal
  DSE_TEMPORAL_PORT: "7233"
  DSE_TEMPORAL_ADDRESS: "{{ include "dse.fullname" . }}-temporal:7233"
  DSE_TEMPORAL_TASK_QUEUE: "dse-core-task-queue"
  DSE_REDIS_HOST: {{ include "dse.fullname" . }}-redis
  DSE_REDIS_PORT: "6379"
  VAULT_ADDR: {{ .Values.secrets.vaultAddr | quote }}
  # FQDN (não nome curto): o Pod de sandbox roda em runtime.sandboxNamespace,
  # cujos search domains não acham o Service de egress-proxy em global.namespace.
  # Sem o FQDN, o HTTP(S)_PROXY do Pod dá NXDOMAIN e o clone in-pod falha.
  DSE_EGRESS_PROXY_URL: "http://{{ include "dse.fullname" . }}-egress-proxy.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.egressProxy.port }}"
  # FQDN (não nome curto): o orchestrator e o Pod de sandbox têm HTTPS_PROXY=
  # egress-proxy + NO_PROXY=.svc,.cluster.local. Com nome curto a chamada ao
  # model-gateway é sequestrada pelo proxy (host interno fora da allowlist) →
  # 502 body vazio, o Planner devolve plano vazio e o turno escala. O FQDN casa
  # o NO_PROXY e a chamada vai direta ao Service.
  DSE_MODEL_GATEWAY_URL: "http://{{ include "dse.fullname" . }}-model-gateway.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.modelGateway.port }}"
  DSE_MODEL_GATEWAY_BASE_URL: "http://{{ include "dse.fullname" . }}-model-gateway.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.modelGateway.port }}"
  DSE_MODEL_GATEWAY_ALLOW_FIXTURE: {{ ternary "1" "0" .Values.modelGateway.allowFixture | quote }}
  # URLs dos adapters p/ o post_tracking_comment (status de volta ao Slack/GitHub
  # via /internal/status-comment). FQDN (não nome curto) por 2 motivos: (1) o
  # default do código é "http://adapter-slack:8801" — nome errado (o Service é
  # dse-<...>-adapter-slack) E sem .svc; (2) o orchestrator tem HTTPS_PROXY —
  # nome curto é sequestrado pelo egress-proxy (403). O FQDN casa o NO_PROXY.
  DSE_ADAPTER_GITHUB_URL: "http://{{ include "dse.fullname" . }}-adapter-github.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.adapters.github.port }}"
  DSE_ADAPTER_SLACK_URL: "http://{{ include "dse.fullname" . }}-adapter-slack.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.adapters.slack.port }}"
  DSE_SANDBOX_INPROCESS: {{ ternary "1" "0" .Values.runtime.inProcess | quote }}
  DSE_SANDBOX_LOCAL_FALLBACK_ALLOWED: {{ ternary "1" "0" .Values.runtime.localFallbackAllowed | quote }}
  DSE_SANDBOX_RUNTIME_CLASS: {{ .Values.runtime.sandboxRuntimeClassName | quote }}
  DSE_CODER_SUBSTRATE: {{ .Values.runtime.agentSubstrate | quote }}
  # Driver do sandbox + config do provisionamento K8s (consumidos por
  # sandbox_runtime.driver.select_sandbox_driver e k8s_driver.K8sSandboxConfig).
  DSE_SANDBOX_DRIVER: {{ .Values.runtime.sandboxDriver | quote }}
  DSE_SANDBOX_K8S_NAMESPACE: {{ .Values.runtime.sandboxNamespace | quote }}
  DSE_AGENT_RUNNER_IMAGE: {{ include "dse.image" (dict "root" $ "repository" .Values.runtime.agentRunnerImage.repository "tag" .Values.runtime.agentRunnerImage.tag "digest" .Values.runtime.agentRunnerImage.digest) | quote }}
  # SA que o POD de sandbox roda como (sem RBAC) — igual ao objeto criado em
  # deploy/k8s/sandbox-isolation.yaml. NÃO é a SA do worker (essa tem o RBAC).
  DSE_SANDBOX_SERVICE_ACCOUNT: "dse-sandbox-runner"
  DSE_SANDBOX_CPU_LIMIT: {{ .Values.runtime.sandboxCpuLimit | quote }}
  DSE_SANDBOX_MEM_LIMIT: {{ .Values.runtime.sandboxMemLimit | quote }}
  DSE_SANDBOX_CHECKPOINT_PVC: {{ if .Values.runtime.checkpointPvc.enabled }}{{ include "dse.fullname" . }}-sandbox-checkpoint{{ else }}""{{ end }}
  DSE_WORKER_USE_VERSIONING: {{ ternary "true" "false" .Values.orchestrator.workerVersioning.enabled | quote }}
  DSE_WORKER_BUILD_ID: {{ .Values.orchestrator.workerVersioning.buildId | quote }}
  DSE_EGRESS_PORT: {{ .Values.egressProxy.port | quote }}
  DSE_EGRESS_TENANT_ID: {{ .Values.tenant.id | quote }}
  DSE_EGRESS_MODEL_GATEWAY_HOST: {{ include "dse.fullname" . }}-model-gateway
  DSE_EGRESS_MODEL_GATEWAY_PORT: {{ .Values.modelGateway.port | quote }}
  DSE_EGRESS_REPO_HOST: {{ .Values.egressProxy.repoHost | quote }}
  DSE_EGRESS_CREDENTIAL_BROKER_ENABLED: {{ ternary "1" "0" .Values.egressProxy.credentialBroker.enabled | quote }}
  DSE_EGRESS_CREDENTIAL_ALLOW_FIXTURE: {{ ternary "1" "0" .Values.egressProxy.credentialBroker.allowFixture | quote }}
  # Compatível com a implementação atual. O arquivo abaixo continua montado
  # para a futura política estrita; o gate de piloto não o declara verificado.
  DSE_EGRESS_ALLOW_HOSTS: {{ join "," $allowHosts | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://{{ include "dse.fullname" . }}-otel-collector:4317"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dse.fullname" . }}-egress-allowlist
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
data:
  allowlist.yaml: |
    # Consumido pelo egress-proxy (WS-C) como fonte de verdade da política
    # default-deny — WS-F assina o aceite desta lista (WSF-E2).
    hosts:
      {{- range .Values.egressProxy.allowlist }}
      - host: {{ .host | quote }}
        port: {{ .port }}
        purpose: {{ .purpose | quote }}
      {{- end }}
