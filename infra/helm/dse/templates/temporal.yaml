{{- if .Values.temporal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}-temporal
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.selectorLabels" (dict "component" "temporal" "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dse.selectorLabels" (dict "component" "temporal" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "temporal" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "dse.appPodDefaults" . | nindent 6 }}
      containers:
        - name: temporal
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.temporal.image.repository "tag" .Values.temporal.image.tag "digest" .Values.temporal.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "dse.statefulContainerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: 7233
              name: frontend
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: {{ include "dse.fullname" . }}-postgres
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: "config/dynamicconfig/docker.yaml"
            # Temporal's auto-setup reads POSTGRES_PWD (not POSTGRES_PASSWORD,
            # which is the name in the secret). Without this: "password
            # authentication failed for user dse". POSTGRES_USER comes from the
            # envFrom below.
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.postgresSecretName" . }}
                  key: POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: {{ include "dse.postgresSecretName" . }}
          resources:
            {{- toYaml .Values.temporal.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: 7233 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 7233 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-temporal
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "temporal" "Release" .Release) | nindent 4 }}
  ports:
    - port: 7233
      targetPort: 7233
      name: frontend
{{- if .Values.temporal.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}-temporal-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.selectorLabels" (dict "component" "temporal-ui" "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dse.selectorLabels" (dict "component" "temporal-ui" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "temporal-ui" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "dse.appPodDefaults" . | nindent 6 }}
      containers:
        - name: temporal-ui
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.temporal.ui.image.repository "tag" .Values.temporal.ui.image.tag "digest" .Values.temporal.ui.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "dse.appContainerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TEMPORAL_ADDRESS
              value: "{{ include "dse.fullname" . }}-temporal:7233"
          resources:
            {{- toYaml .Values.temporal.ui.resources | nindent 12 }}
          volumeMounts:
            {{- include "dse.appTmpMount" . | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-temporal-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "temporal-ui" "Release" .Release) | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
      name: http
{{- end }}
{{- end }}
