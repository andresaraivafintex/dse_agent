# Fintex DSE — values.yaml (topologia A: uma instalação = um tenant = um
# namespace dentro do VPC/K8s do próprio cliente). Parametrizado por tenant:
# rode `helm install dse-<tenant> infra/helm/dse -f values-<tenant>.yaml`
# com um arquivo de overrides por cliente (nunca commitar valores reais de
# produção — usar `--set` a partir do secrets backend/CI em vez disso).

tenant:
  id: "acme-dev"            # usado em labels, nomes de recurso e como tenant_id default
  dataClass: "internal"     # internal | confidential | restricted (mapeia para NFR de residência)

# O chart base continua sendo seguro para desenvolvimento local. Os perfis
# `pilot` e `production` ativam validações fail-closed em templates/_helpers.tpl:
# não é possível renderizá-los mantendo fixtures, execução in-process,
# credenciais default ou componentes obrigatórios desligados.
deploymentProfile: development  # development | pilot | production

# Secret K8s opcional (nome) montado via envFrom NO model-gateway E no
# orchestrator. Usado pelo POC para injetar ANTHROPIC_API_KEY/LITELLM_MASTER_KEY
# (o LiteLLM lê do ambiente, não do Vault) + creds do GitHub App (finalize_pr /
# mint de virtual key rodam no orchestrator). Vazio = não injeta nada.
# Em produção estrita, prefira ESO/Vault Agent em vez de um secret plano.
extraEnvSecret: ""

# Gates que dependem de uma evidência externa ao Helm (teste de conformidade
# da imagem/migrações). Permanecem false no repositório por intenção. Só o
# pipeline de release, depois de verificar os digests imutáveis, deve promovê-
# los. Isto impede que `helm template` seja confundido com prova de que o
# runtime/ledger implementam controles que o chart não consegue inspecionar.
pilotReadiness:
  sandboxIsolationVerified: false
  modelGatewayFailClosedVerified: false
  egressStrictPolicyVerified: false
  auditLedgerMigrationsVerified: false
  workerVersioningRegistrationVerified: false

global:
  namespace: dse
  imageRegistry: ""          # ex.: "123456789.dkr.ecr.us-east-1.amazonaws.com/" (com barra final) — vazio = Docker Hub/registro público
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []       # nomes de Secret docker-registry, se o registry do cliente exigir
  labels: {}                 # labels extra aplicadas a todos os recursos (ex.: cost-center)

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

# Defaults Pod Security Standards "restricted" para workloads da aplicação.
# Imagens de infraestrutura que precisam escrever no rootfs usam o perfil
# `statefulContainerSecurityContext`, mas ainda rodam sem privilege escalation
# e sem capabilities Linux.
security:
  tmpSizeLimit: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  appContainerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  statefulContainerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

# Migrações como Job de hook do Helm (Fase 5 — deploy autossuficiente).
migrations:
  enabled: true

runtime:
  # Único valor permitido nos perfis pilot/production. `false` faz o runtime
  # atual falhar fechado em K8s (não há Docker socket montado); o provisionador
  # Kubernetes real continua sendo um blocker externo e é coberto pelo gate
  # pilotReadiness.sandboxIsolationVerified.
  inProcess: true
  localFallbackAllowed: true
  agentSubstrate: fixture
  sandboxRuntimeClassName: ""
  # Driver do sandbox: "docker" (dev local, workspace host-visível) ou "k8s"
  # (Pod efêmero gVisor por tarefa; o worker cria/exec/deleta via kubectl).
  sandboxDriver: "docker"
  # Namespace dos Pods de sandbox — SEPARADO do control plane (PSA restricted +
  # NetworkPolicies próprias em deploy/k8s/sandbox-isolation.yaml).
  sandboxNamespace: "dse-sandboxes"
  # RBAC do worker (SA dedicada + Role para criar/exec/deletar pods no
  # sandboxNamespace). Ligar SÓ com sandboxDriver=k8s.
  sandboxRbac:
    create: false
  # Imagem do agent-runner que roda DENTRO do Pod de sandbox (pinada por digest
  # em perfil estrito, igual aos demais componentes).
  agentRunnerImage:
    repository: dse/agent-runner
    tag: "0.1.0"
    digest: ""
  sandboxCpuLimit: "1"
  sandboxMemLimit: "2Gi"
  # PVC do checkpoint git do sandbox (recuperação pós-chaos/rebuild). emptyDir
  # basta para o 1º turno; PVC é fast-follow.
  checkpointPvc:
    enabled: false
    size: 5Gi
    storageClassName: ""

# ---------------------------------------------------------------------------
# Postgres — control plane (work_items/audit_log/etc.) reside no VPC do
# cliente na topologia A (decisão fixada em WSF-E5-T1). Produção deve preferir
# um Postgres gerenciado (RDS/CloudSQL) com PITR em vez deste StatefulSet —
# ver infra/RUNBOOK-UPGRADE.md e infra/OSS-BOM.md. Este chart cobre o caso
# self-managed-in-cluster para ambientes sem serviço gerenciado disponível.
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    digest: ""
  auth:
    # Dev/local apenas — produção DEVE usar existingSecret (populado via
    # ExternalSecret/Vault, nunca valores em texto plano neste values.yaml).
    existingSecret: ""
    username: dse
    password: dse_dev_only
    database: dse
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

# ---------------------------------------------------------------------------
# Temporal — orquestração durável (WS-B). auto-setup para Fase 1/piloto;
# produção deve migrar para Temporal Cloud ou um cluster self-hosted
# multi-nó dedicado (ver RUNBOOK-UPGRADE.md, Worker Versioning).
# ---------------------------------------------------------------------------
temporal:
  enabled: true
  image:
    repository: temporalio/auto-setup
    tag: "1.29"
    digest: ""
  ui:
    enabled: true
    image:
      repository: temporalio/ui
      tag: "2.31.2"
      digest: ""
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    digest: ""
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# ---------------------------------------------------------------------------
# Vault — em produção, `externallyManaged: true` e apontar `secrets.vaultAddr`
# para o Vault/HSM do próprio cliente (ou um cluster Vault HA dedicado) — o
# `dev mode` deste chart (mesma imagem do docker-compose da fundação) NUNCA
# deve rodar em produção (dados em memória, um único unseal key).
# ---------------------------------------------------------------------------
vault:
  externallyManaged: false
  devMode: true
  image:
    repository: hashicorp/vault
    tag: "1.17"
    digest: ""
  devRootToken: ""  # produção: nunca setar aqui — gerar e guardar fora do chart
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# ---------------------------------------------------------------------------
# Secrets backend (WSF-E2-T3a) — como os demais serviços obtêm credenciais.
# `externalSecrets.enabled: true` requer o External Secrets Operator (ESO)
# já instalado no cluster; caso contrário os serviços leem VAULT_ADDR/
# VAULT_TOKEN diretamente via env (dev/staging apenas).
# ---------------------------------------------------------------------------
secrets:
  vaultAddr: "http://dse-vault:8200"
  externalSecrets:
    enabled: false
    secretStoreRef: "dse-vault-backend"
    secretStoreKind: ClusterSecretStore  # pilot/production exigem SecretStore namespaced
    refreshInterval: "1h"
    remoteKey: ""  # vazio => dse/<tenant.id>/postgres

# ---------------------------------------------------------------------------
# Egress proxy (WS-C constrói, WS-F assina a política/aceite — WSF-E2).
# `allowlist` é injetada como ConfigMap montado pelo proxy; nunca hardcode
# tokens aqui (o proxy busca credenciais efêmeras do secrets backend).
# ---------------------------------------------------------------------------
egressProxy:
  enabled: true
  image:
    repository: dse/egress-proxy
    tag: "0.1.0"
    digest: ""
  replicas: 2
  port: 8806
  repoHost: "github.com"
  credentialBroker:
    enabled: true
    allowFixture: true
  allowlist:
    - host: "api.github.com"
      port: 443
      purpose: "GitHub App API (PR finalizer, status comments)"
    - host: "github.com"
      port: 443
      purpose: "clone do repo alvo dentro do sandbox (git via proxy)"
    - host: "slack.com"
      port: 443
      purpose: "Slack Web API (mensagem de status)"
    - host: "*.amazonaws.com"
      port: 443
      purpose: "Bedrock PrivateLink (model-gateway tier 1)"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# ---------------------------------------------------------------------------
# Model gateway (WS-D) — LiteLLM. Chave virtual por tenant/task/stage vem do
# secrets backend, nunca deste values.yaml.
# ---------------------------------------------------------------------------
modelGateway:
  enabled: true
  image:
    repository: dse/model-gateway
    tag: "0.1.0"
    digest: ""
  allowFixture: true
  replicas: 1
  port: 4000
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }

# ---------------------------------------------------------------------------
# Orchestrator (WS-B) — worker Temporal. Escala horizontal segura (Temporal
# faz o balanceamento de tasks entre workers do mesmo task queue).
# ---------------------------------------------------------------------------
orchestrator:
  enabled: true
  image:
    repository: dse/orchestrator
    tag: "0.1.0"
    digest: ""
  replicas: 2
  healthPort: 8900
  workerVersioning:
    enabled: false
    buildId: "dev"
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }

# ---------------------------------------------------------------------------
# Adapters + ingest-gateway (WS-A)
# ---------------------------------------------------------------------------
adapters:
  slack:
    enabled: true
    image: { repository: dse/adapter-slack, tag: "0.1.0", digest: "" }
    port: 8801
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
  github:
    enabled: true
    image: { repository: dse/adapter-github, tag: "0.1.0", digest: "" }
    port: 8802
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
  ingestGateway:
    enabled: true
    image: { repository: dse/ingest-gateway, tag: "0.1.0", digest: "" }
    port: 8803
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }

validation:
  enabled: true
  image: { repository: dse/validation, tag: "0.1.0", digest: "" }
  port: 8807
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# O ledger é implementado pelo schema Postgres e pelo pacote dse_audit. Este
# flag só controla se a instalação exige esse caminho; a prova de que as
# migrations foram aplicadas é deliberadamente um gate separado acima.
auditLedger:
  enabled: true

# ---------------------------------------------------------------------------
# Model server SELF-HOSTED / air-gapped (Tier 2, WSD-E5-T2/T3) — DESLIGADO na
# topologia A (o model-gateway fala Bedrock via PrivateLink). LIGADO só na
# topologia B / tier mais estrito, onde NENHUM dado de inferência pode sair do
# VPC: o modelo roda in-cluster (GPU) e o model-gateway o consome in-VPC.
# Ver infra/helm/dse/values-topology-b.yaml e infra/helm/dse/TOPOLOGY-B.md.
# ---------------------------------------------------------------------------
modelServer:
  enabled: false
  image:
    repository: dse/model-server-airgapped
    tag: "0.1.0"
    digest: ""
  replicas: 1
  port: 8000
  # GPU: em produção air-gapped, requests/limits de nvidia.com/gpu. Deixado
  # vazio no chart base para o `helm template` validar sem um device plugin.
  gpu: 0
  resources:
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "4", memory: "8Gi" }

# ---------------------------------------------------------------------------
# Observabilidade (WSF-E7-T1)
# ---------------------------------------------------------------------------
otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.105.0"
    digest: ""
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

ingress:
  enabled: false
  className: "nginx"
  host: "dse.example.com"
  tls:
    enabled: true
    secretName: "dse-tls"

# Default-deny de egress a nível de NetworkPolicy — defesa em profundidade
# ADICIONAL ao egress-proxy (o proxy é a linha de defesa primária no data
# path da aplicação; a NetworkPolicy é uma segunda camada estrutural que
# nem depende do proxy estar corretamente configurado para valer).
networkPolicy:
  enabled: true
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # Só o egress-proxy recebe esta saída. Em pilot/production a lista não pode
  # ficar vazia. O default sugerido no overlay bloqueia redes privadas e o
  # metadata endpoint; a allowlist L7 do proxy continua sendo obrigatória.
  egressProxyExternalCidrs: []
  # Rota do worker do orchestrator até o API server do K8s (o kubectl que cria
  # os Pods de sandbox). Necessário com sandboxDriver=k8s sob default-deny.
  # DOIS consumidores com endereços DIFERENTES (não confundir):
  #  - serviceHost: o ClusterIP que o kubectl MIRA (KUBERNETES_SERVICE_HOST,
  #    ex.: 10.43.0.1 no k3s). Vai para o NO_PROXY do orchestrator (senão o
  #    HTTPS_PROXY sequestra a chamada). NO_PROXY é agnóstico de porta.
  #  - cidrs: o endpoint que a NetworkPolicy de egress precisa LIBERAR. Sob
  #    k3s/Calico/Cilium a policy é avaliada PÓS-DNAT → geralmente o IP do NÓ
  #    (nodeIP/32), não o ClusterIP. VERIFICAR contra o CNI do cluster-alvo.
  #  - port: porta do endpoint na regra da NetworkPolicy (6443 no nodeIP).
  kubeApiServer:
    serviceHost: "10.43.0.1"
    cidrs: []
    port: 6443
