# Fintex DSE — TOPOLOGY B overlay (WSF-E5-T3, Phase 4).
#
# Usage:
#   helm template dse-<tenant> infra/helm/dse \
#       -f infra/helm/dse/values.yaml \
#       -f infra/helm/dse/values-topology-b.yaml \
#       -f values-<tenant>.yaml
#
# Topology B = the STRICTEST TIER: EVERYTHING runs inside the customer's VPC,
# with NO managed or shared external dependency at all — no Temporal Cloud, no
# managed Postgres (RDS/CloudSQL), no external Vault, no external model
# provider. It differs from topology A (which ALLOWS pointing at managed/shared
# services in production) by forbidding all of them.
#
# Cost consequence: every customer gets a COMPLETE STANDALONE STACK — the
# operational cost does NOT amortize across customers (NFR-08 × N). See
# infra/helm/dse/TOPOLOGY-B.md for the breakdown.
#
# This file contains ONLY the overrides that differ from the base values.yaml;
# anything not listed here inherits the default (which is already self-hosted).

# --- Postgres: self-managed in-cluster MANDATORY (no RDS/CloudSQL). ---
# Under topology B the customer owns PITR/backup of this StatefulSet inside the VPC.
postgres:
  enabled: true
  persistence:
    enabled: true
    size: 50Gi            # larger: it is the only Postgres, with no managed service behind it
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "4Gi" }

# --- Temporal: self-hosted in-cluster (NOT Temporal Cloud). ---
temporal:
  enabled: true
  ui:
    enabled: true         # the orchestration console ALSO stays inside the VPC
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "4Gi" }

# --- Vault: in-cluster, NEVER pointing at an external/shared Vault. ---
# devMode remains FORBIDDEN in production — use an in-VPC HA Vault (unseal
# managed by the customer). externallyManaged=false forces the chart's Vault.
vault:
  externallyManaged: false
  devMode: false

secrets:
  vaultAddr: "http://dse-vault:8200"
  externalSecrets:
    enabled: true         # ESO in-cluster; secretStore points at the in-VPC Vault
    secretStoreRef: "dse-vault-backend"

# --- Egress: INTERNAL-ONLY allowlist. No public host (not even *.amazonaws.com). ---
# The only model destination is the in-cluster model-server (through the
# model-gateway); git/registry must be the customer's internal mirrors. Adjust per customer.
egressProxy:
  enabled: true
  allowlist:
    - host: "git.internal"
      port: 443
      purpose: "internal git remote (GitHub Enterprise/on-prem GitLab mirrored in the VPC)"
    - host: "registry.internal"
      port: 443
      purpose: "internal package mirror (no public pypi.org/npmjs.org)"
  # NOTE: no entry for api.github.com/slack.com/*.amazonaws.com — in an
  # air-gapped setup those hosts are unreachable by construction. If the customer
  # requires Slack, it is an explicit exception reviewed by the red team (§4 of
  # RED-TEAM-PROGRAM.md), not a default.

# --- Model gateway: consumes the LOCAL model-server, no external provider. ---
modelGateway:
  enabled: true

# --- Air-gapped model server ON (the structural difference of topology B). ---
modelServer:
  enabled: true
  replicas: 1
  gpu: 1                  # air-gapped production: dedicated in-VPC GPU

# --- Egress default-deny NetworkPolicy MANDATORY (defence in depth). ---
networkPolicy:
  enabled: true

# --- Internal Ingress only (no public exposure). ---
ingress:
  enabled: false
