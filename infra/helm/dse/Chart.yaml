apiVersion: v2
name: dse
description: >-
  Fintex DSE — "topology A" packaging chart (self-hosted, single-tenant per
  installation, inside the regulated customer's VPC/K8s — ADR-23). Covers the
  full Phase 1 steady state: Postgres, Temporal (+ UI), Redis, Vault
  (optional — production should use the customer's Vault or an external HA
  cluster, see values.yaml `vault.externallyManaged`), egress-proxy,
  model-gateway, orchestrator and the adapters (Slack/GitHub) + ingest-gateway.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - dse
  - fintex
  - self-hosted
  - regulated-fintech
maintainers:
  - name: WS-F (Platform, Security and Operations)
