# WSF-E2-T3b(b) — exemplo vivo de secrets de preview via ESO (ADR-28).
#
# Um namespace de preview (aqui `dse-preview-example`; os reais são criados
# pelo ApplicationSet do WS-E, um por PR) consome secrets EXCLUSIVAMENTE via
# ExternalSecret -> ClusterSecretStore `dse-vault` -> Vault KV v2
# `secret/dse/preview/<nome>`. Nenhum secret em manifest/Helm values em
# claro; o Secret k8s é materializado (e re-sincronizado a cada
# refreshInterval) pelo operator.
#
# Teste real: services/platform/tests/test_eso_preview_secrets.py prova que
# (a) o Secret materializa com o valor do Vault e (b) uma rotação no Vault
# se propaga dentro do refreshInterval.
apiVersion: v1
kind: Namespace
metadata:
  name: dse-preview-example
  labels:
    app.kubernetes.io/part-of: dse
    dse.fintex/preview: "true"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preview-app-secrets
  namespace: dse-preview-example
  labels:
    app.kubernetes.io/part-of: dse
    dse.fintex/owner: ws-f
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: ClusterSecretStore
    name: dse-vault
  target:
    name: preview-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: dse/preview/example
        property: database_url
    - secretKey: api_key
      remoteRef:
        key: dse/preview/example
        property: api_key
