# WSF-E2-T3b(b) — living example of preview secrets via ESO (ADR-28).
#
# A preview namespace (here `dse-preview-example`; the real ones are created
# by WS-E's ApplicationSet, one per PR) consumes secrets EXCLUSIVELY through
# ExternalSecret -> ClusterSecretStore `dse-vault` -> Vault KV v2
# `secret/dse/preview/<name>`. No secret lives in a manifest or in Helm
# values in the clear; the k8s Secret is materialized (and re-synced every
# refreshInterval) by the operator.
#
# Real test: services/platform/tests/test_eso_preview_secrets.py proves that
# (a) the Secret materializes with the Vault value and (b) a rotation in
# Vault propagates within refreshInterval.
apiVersion: v1
kind: Namespace
metadata:
  name: dse-preview-example
  labels:
    app.kubernetes.io/part-of: dse
    dse.fintex/preview: "true"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preview-app-secrets
  namespace: dse-preview-example
  labels:
    app.kubernetes.io/part-of: dse
    dse.fintex/owner: ws-f
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: ClusterSecretStore
    name: dse-vault
  target:
    name: preview-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: dse/preview/example
        property: database_url
    - secretKey: api_key
      remoteRef:
        key: dse/preview/example
        property: api_key
