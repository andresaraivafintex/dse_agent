# WSF-E2-T3b(b) — single ClusterSecretStore for preview secrets (ADR-28).
#
# Contract for WS-E (WSE-E4-T10): every ExternalSecret in a preview
# namespace references { kind: ClusterSecretStore, name: dse-vault } and
# reads paths under `dse/preview/...` (KV v2 mount `secret`). The token in
# use (Secret `dse-vault-token` in the external-secrets namespace, minted by
# setup-eso.sh) is scoped by the `dse-preview-read` policy — it only sees
# secret/data/dse/preview/* (Vault deny-by-default for everything else).
#
# `server` uses the compose service name (`vault`) — the k3d cluster sits on
# the foundation's dse_net network, so the pods resolve the compose
# containers by name (see infra/k8s-local/setup-k3d-argocd.sh).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dse-vault
  labels:
    app.kubernetes.io/part-of: dse
    dse.fintex/owner: ws-f
spec:
  provider:
    vault:
      server: "http://vault:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: dse-vault-token
          key: token
          namespace: external-secrets
