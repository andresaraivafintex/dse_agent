# WSF-E2-T3b(b) — ClusterSecretStore único para secrets de preview (ADR-28).
#
# Contrato para o WS-E (WSE-E4-T10): todo ExternalSecret de namespace de
# preview referencia { kind: ClusterSecretStore, name: dse-vault } e lê
# paths sob `dse/preview/...` (mount KV v2 `secret`). O token usado (Secret
# `dse-vault-token` no namespace external-secrets, mintado por
# setup-eso.sh) é escopado pela policy `dse-preview-read` — só enxerga
# secret/data/dse/preview/* (deny-by-default do Vault para o resto).
#
# `server` usa o nome de serviço do compose (`vault`) — o cluster k3d está
# na rede dse_net da fundação, então os pods resolvem os containers do
# compose pelo nome (ver infra/k8s-local/setup-k3d-argocd.sh).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dse-vault
  labels:
    app.kubernetes.io/part-of: dse
    dse.fintex/owner: ws-f
spec:
  provider:
    vault:
      server: "http://vault:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: dse-vault-token
          key: token
          namespace: external-secrets
