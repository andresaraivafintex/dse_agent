# WSF-E7-T1 — local otel-collector config (docker-compose.wsf.yml).
# Mirrors (in spirit) the ConfigMap generated by infra/helm/dse/templates/otel-collector.yaml
# for production — here we use the `logging`/`debug` exporter (stdout) because
# there is no real observability backend provisioned in this dev environment.
# Production: swap the exporter for `otlphttp` pointing at the customer's real
# backend (Datadog/Grafana Cloud/Honeycomb/etc.) — see infra/ALERTING-RULES.md.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # The dse.tenant_id / dse.work_item_id / dse.stage / dse.model /
  # dse.cost_usd / dse.tokens_in / dse.tokens_out attributes (dse_contracts.
  # constants.OTEL_ATTR_*) already arrive on the spans emitted by the services
  # (WS-D → WS-F contract) — no extra transformation is needed here beyond
  # batching for export efficiency.

  # ---------------------------------------------------------------------
  # ALERTING-RULES.md §3 ENABLED (Phase 3) — approaching the Temporal history
  # limit. WS-B emits the metric at every workflow boundary
  # (emit_history_metric); this dedicated pipeline drops everything below the
  # threshold and tags what is left with dse.alert/severity — the line the
  # debug exporter prints IS the alert (MVP; the real upgrade is documented in
  # infra/ALERTING-RULES.md: swap the exporter for Alertmanager/a backend).
  #
  # Thresholds (Temporal default limits: 51,200 events / 50MB hard):
  #   length (number of events): warning >= 35,840 (70%), critical >= 46,080 (90%)
  #   size (bytes):              warning >= 36,700,160 (70% of 50MB),
  #                              critical >= 47,185,920 (90%)
  # Accepted metric names (contract to pin down with WS-B — any of them):
  #   dse.workflow.history_length | temporal_workflow_event_history_length (events)
  #   dse.workflow.history_size_bytes | temporal_workflow_event_history_size (bytes)
  filter/history_alert:
    error_mode: ignore
    metrics:
      datapoint:
        # drop 1: any metric that is not a history metric
        - >-
          not(IsMatch(metric.name,
          "^(dse\\.workflow\\.history_length|temporal_workflow_event_history_length|dse\\.workflow\\.history_size_bytes|temporal_workflow_event_history_size)$"))
        # drop 2: length below the warning level (70% of 51,200 events).
        # OTTL note: on an int datapoint, value_double evaluates to 0.0 (zero
        # value, not nil) — hence the AND of both comparisons: the clause for
        # the type NOT in use is always true (0 < threshold) and the one for
        # the type in use decides. The nil guards cover the other semantics.
        - >-
          IsMatch(metric.name, "^(dse\\.workflow\\.history_length|temporal_workflow_event_history_length)$")
          and (value_int == nil or value_int < 35840)
          and (value_double == nil or value_double < 35840.0)
        # drop 3: bytes below the warning level (70% of 50MB)
        - >-
          IsMatch(metric.name, "^(dse\\.workflow\\.history_size_bytes|temporal_workflow_event_history_size)$")
          and (value_int == nil or value_int < 36700160)
          and (value_double == nil or value_double < 36700160.0)

  transform/history_alert:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["dse.alert"], "temporal_history_threshold_exceeded")
          - set(attributes["dse.alert_severity"], "warning")
          - set(attributes["dse.alert_severity"], "critical")
            where IsMatch(metric.name, "^(dse\\.workflow\\.history_length|temporal_workflow_event_history_length)$")
            and ((value_int != nil and value_int >= 46080) or (value_double != nil and value_double >= 46080.0))
          - set(attributes["dse.alert_severity"], "critical")
            where IsMatch(metric.name, "^(dse\\.workflow\\.history_size_bytes|temporal_workflow_event_history_size)$")
            and ((value_int != nil and value_int >= 47185920) or (value_double != nil and value_double >= 47185920.0))

exporters:
  debug:
    verbosity: detailed
  # History alert channel (MVP): the ONLY lines that reach here have already
  # crossed the threshold — presence in the collector stdout = active alert.
  # Production: replace with a real exporter (prometheusremotewrite +
  # Alertmanager, or the customer's backend) keeping the filter/transform above.
  debug/history_alert:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    # DEDICATED pipeline for the §3 alert — no batch (alert latency > efficiency).
    metrics/history_alert:
      receivers: [otlp]
      processors: [filter/history_alert, transform/history_alert]
      exporters: [debug/history_alert]
  telemetry:
    logs:
      level: info
