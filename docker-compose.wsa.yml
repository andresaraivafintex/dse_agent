# WS-A — Ingestão e adaptadores (ver CONVENTIONS.md). Fragment reservado do
# WS-A: só os serviços deste workstream, conectados à rede externa `dse_net`
# (declarada em docker-compose.yml, fundação). `make up` faz o merge de
# todos os fragments `docker-compose.ws*.yml` presentes.
#
# Build a partir da RAIZ do monorepo (contexto = `.`) porque cada Dockerfile
# precisa copiar `packages/*` além do próprio serviço.

services:
  adapter-slack:
    build:
      context: .
      dockerfile: services/adapter-slack/Dockerfile
    container_name: dse_adapter_slack
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: dse_dev_root
      DSE_TENANT_ID: ${DSE_TENANT_ID:-tenant_dev}
    ports:
      - "8801:8801"
    networks: [dse_net]
    restart: unless-stopped

  adapter-github:
    build:
      context: .
      dockerfile: services/adapter-github/Dockerfile
    container_name: dse_adapter_github
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: dse_dev_root
      DSE_TENANT_ID: ${DSE_TENANT_ID:-tenant_dev}
    ports:
      - "8802:8802"
    networks: [dse_net]
    restart: unless-stopped

  ingest-gateway:
    build:
      context: .
      dockerfile: services/ingest-gateway/Dockerfile
    container_name: dse_ingest_gateway
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
    ports:
      - "8803:8803"
    networks: [dse_net]
    restart: unless-stopped

  ingest-dispatcher:
    build:
      context: .
      dockerfile: services/ingest-gateway/Dockerfile
    container_name: dse_ingest_dispatcher
    command: ["python", "-m", "ingest_gateway.dispatcher_main"]
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      TEMPORAL_ADDRESS: temporal:7233
    networks: [dse_net]
    restart: unless-stopped
    depends_on:
      - temporal

  # --- Fase 2 (WSA-E5): adapter Jira + workers de transição/poll ---
  adapter-jira:
    build:
      context: .
      dockerfile: services/adapter-jira/Dockerfile
    container_name: dse_adapter_jira
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_ACCOUNT_EMAIL: ${JIRA_ACCOUNT_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_TRIGGER_LABEL: ${JIRA_TRIGGER_LABEL:-dse}
      JIRA_PLAN_APPROVED_STATUS: ${JIRA_PLAN_APPROVED_STATUS:-Plan approved}
      JIRA_PLAN_REJECTED_STATUS: ${JIRA_PLAN_REJECTED_STATUS:-Plan rejected}
      JIRA_POLL_PROJECTS: ${JIRA_POLL_PROJECTS:-}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: dse_dev_root
      DSE_TENANT_ID: ${DSE_TENANT_ID:-tenant_dev}
    ports:
      - "8804:8804"
    networks: [dse_net]
    restart: unless-stopped

  # Worker de transições serializadas por ticket (WSA-E5-T3).
  adapter-jira-transitions:
    build:
      context: .
      dockerfile: services/adapter-jira/Dockerfile
    container_name: dse_adapter_jira_transitions
    command: ["python", "-m", "adapter_jira.transition_main"]
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_ACCOUNT_EMAIL: ${JIRA_ACCOUNT_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: dse_dev_root
    networks: [dse_net]
    restart: unless-stopped

  # --- Fase 4 (WSA, PROVISÃO): adapter Teams — NÃO ativado (ver
  # services/adapter-teams/README.md). Sobe o serviço (health/outbound
  # funcionam); o inbound retorna 501 teams_not_activated até a fundação
  # expor Platform.teams + activation.sql. Porta 8808. ---
  adapter-teams:
    build:
      context: .
      dockerfile: services/adapter-teams/Dockerfile
    container_name: dse_adapter_teams
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      TEAMS_OUTGOING_SECRET: ${TEAMS_OUTGOING_SECRET:-}
      TEAMS_APP_ID: ${TEAMS_APP_ID:-}
      TEAMS_APP_PASSWORD: ${TEAMS_APP_PASSWORD:-}
      TEAMS_SERVICE_URL: ${TEAMS_SERVICE_URL:-}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: dse_dev_root
      DSE_TENANT_ID: ${DSE_TENANT_ID:-tenant_dev}
    ports:
      - "8808:8808"
    networks: [dse_net]
    restart: unless-stopped

  # Poller de fallback do webhook Jira (best-effort) — WSA-E5-T2.
  adapter-jira-poller:
    build:
      context: .
      dockerfile: services/adapter-jira/Dockerfile
    container_name: dse_adapter_jira_poller
    command: ["python", "-m", "adapter_jira.poller_main"]
    environment:
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_ACCOUNT_EMAIL: ${JIRA_ACCOUNT_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_TRIGGER_LABEL: ${JIRA_TRIGGER_LABEL:-dse}
      JIRA_PLAN_APPROVED_STATUS: ${JIRA_PLAN_APPROVED_STATUS:-Plan approved}
      JIRA_PLAN_REJECTED_STATUS: ${JIRA_PLAN_REJECTED_STATUS:-Plan rejected}
      JIRA_POLL_PROJECTS: ${JIRA_POLL_PROJECTS:-}
      JIRA_POLL_INTERVAL_SECONDS: ${JIRA_POLL_INTERVAL_SECONDS:-60}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: dse_dev_root
      DSE_TENANT_ID: ${DSE_TENANT_ID:-tenant_dev}
    networks: [dse_net]
    restart: unless-stopped
