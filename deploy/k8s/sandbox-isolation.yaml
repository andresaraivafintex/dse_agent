# Plan 08 §G — cluster-side prerequisites for the isolated sandbox runtime.
# Apply ONCE on the pilot cluster (`kubectl apply -f`). The live proof of
# isolation (the Pod running under gVisor/Kata) depends on the RuntimeClass being
# installed in the cluster — an infra decision owned by the platform team.
---
apiVersion: v1
kind: Namespace
metadata:
  name: dse-sandboxes
  labels:
    dse.fintex/purpose: sandbox-isolation
    # Pod Security Admission "restricted" baseline: enforces at admission time
    # the same hardening build_pod_manifest already asks for (defence in depth).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# Minimal SA: no RBAC (no RoleBinding) → the token (not even mounted) cannot talk
# to the cluster API. automountServiceAccountToken=false on the Pod as well.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dse-sandbox-runner
  namespace: dse-sandboxes
automountServiceAccountToken: false
---
# Strong-isolation RuntimeClass (gVisor). The handler ('runsc') has to be
# installed on the nodes (containerd + runsc). Kata is the alternative (handler
# 'kata'); switch DSE_SANDBOX_RUNTIME_CLASS accordingly.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
# Egress default-deny NetworkPolicy: the sandbox talks to NOTHING by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dse-sandbox-default-deny-egress
  namespace: dse-sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: dse-sandbox
  policyTypes: ["Egress"]
  egress: []   # nothing — the allow below is the only path
---
# The only permitted egress: DNS + egress-proxy (which enforces the real host
# allowlist) + model-gateway (the turn makes a model call). All the rest of the
# agent's outbound traffic goes through the auditable proxy.
# Selectors/ports ALIGNED with the chart (real deploy): label
# app.kubernetes.io/name (not {app: ...}) and egress-proxy port 8806
# (values.yaml egressProxy.port) — the old value (3128) left the Pod with no
# route to the proxy under default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dse-sandbox-allow-egress-proxy
  namespace: dse-sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: dse-sandbox
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {app.kubernetes.io/name: egress-proxy}
      ports:
        - {protocol: TCP, port: 8806}
    - to:  # model-gateway (the turn's model call)
        - namespaceSelector: {}
          podSelector:
            matchLabels: {app.kubernetes.io/name: model-gateway}
      ports:
        - {protocol: TCP, port: 4000}
    - ports:  # DNS
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
