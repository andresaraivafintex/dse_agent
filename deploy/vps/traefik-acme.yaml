# Let's Encrypt for the k3s built-in Traefik.
#
# This lives outside the DSE chart on purpose: Traefik is installed by k3s
# itself and k3s reconciles it from this HelmChartConfig — editing the
# Deployment directly would be reverted on the next k3s restart.
#
# Requires inbound TCP/80 from the internet: the HTTP-01 challenge is answered
# on the `web` entrypoint, so a closed port 80 means no certificate at all, even
# though the traffic you actually care about arrives on 443.
#
# Persistence is load-bearing. Without it acme.json lives in the container
# filesystem and every Traefik restart re-issues from scratch — which walks
# straight into Let's Encrypt's 50-certificates-per-domain-per-week limit and
# then stops issuing anything.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    persistence:
      enabled: true
      size: 128Mi
      path: /data
    # Passed as raw CLI flags on purpose. The `certificatesResolvers:` value
    # block is silently dropped by the Traefik chart version k3s bundles — the
    # deployment comes up fine and only fails later, at request time, with
    # "uses a nonexistent resolver". `additionalArguments` is honoured by every
    # chart version, so the resolver either exists or the pod fails to start.
    additionalArguments:
      - "--certificatesresolvers.le.acme.email=ACME_EMAIL_PLACEHOLDER"
      - "--certificatesresolvers.le.acme.storage=/data/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    deployment:
      initContainers:
        # Traefik runs as non-root and refuses an acme.json that is not 0600.
        - name: acme-permissions
          image: busybox:1.36
          command: ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json"]
          volumeMounts:
            - name: data
              mountPath: /data
