# Pilot VPS overlay (2 vCPU / 8 GB) — plan 09, Phase 5. Copy to
# values-vps-secrets.yaml, fill in the secrets and encrypt it with SOPS.
# Applies ON TOP OF values-pilot.yaml (which brings the fail-closed gates).

tenant:
  id: "SEU-TENANT"

global:
  imageRegistry: "ghcr.io/SUA-ORG/"   # release-workflow images, by digest

runtime:
  inProcess: false
  agentSubstrate: claude-agent
  sandboxRuntimeClassName: gvisor      # installed by bootstrap-k3s.sh

# MANAGED Postgres outside the VPS (PITR/restore for free). The internal
# StatefulSet stays off.
postgres:
  enabled: false
  auth:
    existingSecret: dse-postgres-managed   # created from SOPS

# Vault server out of scope for the pilot: native K8s secrets populated via SOPS.
vault:
  enabled: false

# Topology A: no local model-server; Teams off.
modelServer:
  enabled: false
adapters:
  teams:
    enabled: false

# Anti-starvation on the 2 vCPU VPS (hard rule from plan 09):
orchestrator:
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }
temporal:
  resources:
    requests: { cpu: "400m", memory: "768Mi" }
    limits: { cpu: "1", memory: "1536Mi" }

# Sandbox: 1 task at a time, capped pod (the turn waits on the model — network,
# not CPU); concurrency is worker config (DSE_SANDBOX_MAX_CONCURRENT=1 in the
# configmap).
