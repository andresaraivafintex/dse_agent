# Overlay da VPS piloto (2 vCPU / 8 GB) — plano 09, Fase 5. Copie para
# values-vps-secrets.yaml, preencha os segredos e criptografe com SOPS.
# Aplica POR CIMA de values-pilot.yaml (que traz os gates fail-closed).

tenant:
  id: "SEU-TENANT"

global:
  imageRegistry: "ghcr.io/SUA-ORG/"   # imagens do workflow release, por digest

runtime:
  inProcess: false
  agentSubstrate: claude-agent
  sandboxRuntimeClassName: gvisor      # instalado pelo bootstrap-k3s.sh

# Postgres GERENCIADO fora da VPS (PITR/restore de graça). O StatefulSet
# interno fica desligado.
postgres:
  enabled: false
  auth:
    existingSecret: dse-postgres-managed   # criado a partir do SOPS

# Vault server fora do piloto: secrets nativos K8s populados via SOPS.
vault:
  enabled: false

# Topologia A: sem model-server local; Teams desligado.
modelServer:
  enabled: false
adapters:
  teams:
    enabled: false

# Anti-starvation na VPS 2 vCPU (regra dura do plano 09):
orchestrator:
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }
temporal:
  resources:
    requests: { cpu: "400m", memory: "768Mi" }
    limits: { cpu: "1", memory: "1536Mi" }

# Sandbox: 1 tarefa por vez, pod capado (o turno espera modelo — rede, não CPU)
# concorrência é config do worker (DSE_SANDBOX_MAX_CONCURRENT=1 no configmap).
