networks:
  dse_net:
    name: dse_net

volumes:
  dse_pg_data:
  dse_vault_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: dse_postgres
    environment:
      POSTGRES_USER: dse
      POSTGRES_PASSWORD: dse_dev_only
      POSTGRES_DB: dse
    ports:
      - "5432:5432"
    volumes:
      - dse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse -d dse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dse_net]

  temporal:
    image: temporalio/auto-setup:1.29
    container_name: dse_temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: dse
      POSTGRES_PWD: dse_dev_only
      POSTGRES_SEEDS: postgres
      # Phase 1 integration finding: "development-sql.yaml" does not exist in
      # the auto-setup image (the container stayed Exited(1) until someone
      # manually copied an empty file — a fix that only "held" while nobody
      # recreated the container). The image already ships an empty-but-valid
      # "docker.yaml" for this exact purpose — use that one.
      #
      # Phase 2 (WSB-E1-T5, addendum 01): image bumped from auto-setup:1.24
      # to 1.29 (highest version available in the registry; 1.31+, which brings
      # native Priority & Fairness, is not published yet). Temporal state lives
      # in its own Postgres databases (temporal, temporal_visibility), so the
      # upgrade is safe — the schema is migrated by auto-setup at boot.
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      # auto-setup defaults this to 24h, so a work item's workflow history is
      # gone a day after it closes — the same 30d the chart sets. Unlike the
      # cluster, a fresh compose volume really does hit the namespace-creation
      # branch, so this is the one place the value takes effect end to end.
      DEFAULT_NAMESPACE_RETENTION: 720h
    ports:
      - "7233:7233"
    networks: [dse_net]

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: dse_temporal_ui
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8088:8080"
    networks: [dse_net]

  redis:
    image: redis:7-alpine
    container_name: dse_redis
    ports:
      - "6379:6379"
    networks: [dse_net]

  vault:
    image: hashicorp/vault:1.17
    container_name: dse_vault
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dse_dev_root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - dse_vault_data:/vault/data
    networks: [dse_net]

# Each workstream adds its own services in docker-compose.wsX.yml (external network
# `dse_net`, already created above) — see CONVENTIONS.md. Do not edit this file outside
# the foundation; `make up` merges every `docker-compose.ws*.yml` fragment present.
