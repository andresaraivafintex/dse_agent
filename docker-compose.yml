networks:
  dse_net:
    name: dse_net

volumes:
  dse_pg_data:
  dse_vault_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: dse_postgres
    environment:
      POSTGRES_USER: dse
      POSTGRES_PASSWORD: dse_dev_only
      POSTGRES_DB: dse
    ports:
      - "5432:5432"
    volumes:
      - dse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse -d dse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dse_net]

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: dse_temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: dse
      POSTGRES_PWD: dse_dev_only
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    networks: [dse_net]

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: dse_temporal_ui
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8088:8080"
    networks: [dse_net]

  redis:
    image: redis:7-alpine
    container_name: dse_redis
    ports:
      - "6379:6379"
    networks: [dse_net]

  vault:
    image: hashicorp/vault:1.17
    container_name: dse_vault
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dse_dev_root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - dse_vault_data:/vault/data
    networks: [dse_net]

# Cada workstream adiciona os próprios serviços em docker-compose.wsX.yml (rede externa
# `dse_net`, já criada acima) — ver CONVENTIONS.md. Não edite este arquivo por fora da
# fundação; `make up` faz o merge de todos os fragments `docker-compose.ws*.yml` presentes.
