# WS-E — docker-compose fragment (see CONVENTIONS.md §Fase 3). Connects to the
# external network `dse_net` already declared in the foundation. `make up`
# merges every `docker-compose.ws*.yml` fragment present.
#
# Phase 3 services (WSE-E5-T12 / WSE-E4-T10):
#
#   garage        — self-hosted S3 artifact store (dxflrs/garage, PINNED tag —
#                   P7/NFR-09, upgrades are an explicit act). Single-node dev
#                   layout; the layout/bucket/key bootstrap is idempotent and
#                   done in code (dse_validation.evidence.garage.ensure_garage_ready)
#                   via the admin API (:3903). Ports reserved in CONVENTIONS.md:
#                   3900 (S3 API) / 3903 (admin).
#
#   wse-gitserver — SMART HTTP git (git-http-backend behind nginx+fcgiwrap,
#                   dedicated image in services/validation/gitserver/) serving
#                   the BARE git repo of preview manifests to the Argo CD of
#                   the k3d cluster (dse_net network — the pods reach
#                   `dse-wse-gitserver` by name). Smart HTTP is mandatory:
#                   Argo CD's go-git does not speak the dumb protocol. The host
#                   writes to the repo straight through the filesystem (bind
#                   mount) — fetch-only over the network, no port published on
#                   the host.

networks:
  dse_net:
    external: true
    name: dse_net

services:
  garage:
    image: dxflrs/garage:v1.1.0
    container_name: dse_garage
    restart: unless-stopped
    volumes:
      - ./services/validation/garage/garage.toml:/etc/garage.toml:ro
      - dse_garage_meta:/var/lib/garage/meta
      - dse_garage_data:/var/lib/garage/data
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # admin API
    networks: [dse_net]

  wse-gitserver:
    build:
      context: ./services/validation/gitserver
    container_name: dse-wse-gitserver
    restart: unless-stopped
    volumes:
      - ./services/validation/preview_repo:/srv/git:ro
    networks: [dse_net]

volumes:
  dse_garage_meta:
  dse_garage_data:
