services:
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: dse_orchestrator
    environment:
      DSE_TEMPORAL_ADDRESS: temporal:7233
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_AUDIT_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_IDENTITY_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      # Plano 08 §F (F5) — Worker Deployment Versioning (moderno, PINNED).
      # build_id PINADO por deploy (não mais "dev") + nome do deployment. Pine
      # DSE_WORKER_BUILD_ID ao SHA/tag da imagem em produção (ex.: git-abc123).
      # DSE_WORKER_USE_VERSIONING default OFF: ligar exige o server com
      # deployment versioning habilitado + o cutover via CLI
      # (`temporal worker-deployment set-current-version`). Ver RUNBOOK.md
      # §Worker-Versioning. Com ON, workflows em voo drenam na versão antiga
      # (PINNED) e só os novos vão para a versão corrente.
      DSE_WORKER_BUILD_ID: ${DSE_WORKER_BUILD_ID:-v1}
      DSE_WORKER_DEPLOYMENT_NAME: ${DSE_WORKER_DEPLOYMENT_NAME:-dse-orchestrator}
      DSE_WORKER_USE_VERSIONING: ${DSE_WORKER_USE_VERSIONING:-false}
      DSE_ORCHESTRATOR_HEALTH_PORT: "8900"
      # Fase 3 (ativacao do alerta de history, ALERTING-RULES.md §3 com WS-F):
      # aponte DSE_OTEL_EXPORTER=otlp para enviar traces + a metrica
      # dse.workflow.history_length ao otel-collector do WS-F (porta 4317).
      DSE_OTEL_EXPORTER: ${DSE_OTEL_EXPORTER:-console}
      DSE_OTEL_EXPORTER_OTLP_ENDPOINT: ${DSE_OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      # Fase 3 (WSB-E4-T2/ADR-26) — caps e debounce configuraveis sem redeploy:
      DSE_REVIEW_ROUND_CAP: ${DSE_REVIEW_ROUND_CAP:-20}
      DSE_EVIDENCE_DEBOUNCE_SECONDS: ${DSE_EVIDENCE_DEBOUNCE_SECONDS:-300}
      DSE_EVIDENCE_REFRESH_CAP: ${DSE_EVIDENCE_REFRESH_CAP:-5}
      # Fase 2 (WSB-E1-T3) — fairness worker-side (caps de concorrencia por
      # tenant lidos de tenant_config). "native" so quando o server for 1.31+.
      DSE_FAIRNESS_MODE: ${DSE_FAIRNESS_MODE:-worker-side}
      # Fase 2 (WSB-E3-T2) — POLITICA do gate de aprovacao (P1: fora do modelo).
      DSE_REQUIRE_APPROVAL_RISK_CLASSES: ${DSE_REQUIRE_APPROVAL_RISK_CLASSES:-high}
      # Consumidos pelas Activities cross-workstream registradas neste worker
      # unico (WS-C sandbox_runtime + WS-E dse_validation, ver worker.py):
      DSE_MODEL_GATEWAY_URL: http://model-gateway:4000
      # model_gateway_client (planner real via gateway) usa ESTE nome de env:
      DSE_MODEL_GATEWAY_BASE_URL: http://model-gateway:4000
      DSE_SANDBOX_STATE_DIR: /tmp/dse-sandboxes
      # PoC (2026-07-21): Coder aponta para o alias real da Anthropic no gateway
      # e minta a virtual key via /key/generate com a master key (control plane).
      # Modo econômico (2026-07-22): Haiku 4.5 default (~3× mais barato). Para
      # voltar ao Sonnet: DSE_CODER_MODEL=anthropic/claude ./dse.sh start.
      # Planner/Tester herdam (DSE_PLANNER_MODEL/DSE_TESTER_MODEL sobrepõem).
      DSE_CODER_MODEL: ${DSE_CODER_MODEL:-anthropic/claude-haiku}
      DSE_CODER_SUBSTRATE: ${DSE_CODER_SUBSTRATE:-fake}
      # S7 (Fase 5) — L1 configurado para o repo de PoC (fintex-wallet, JS):
      # os checks Python (lint/typecheck/build) são pulados (comando vazio);
      # o teste real é um syntax-check do entrypoint (node --check, sem
      # node_modules). secret-scan + diff-budget/forbidden-paths (agnósticos
      # de linguagem) seguem ativos. NOTA: derivar os comandos de L1 do próprio
      # repo (package.json/Makefile) é trabalho futuro — hoje é config por env.
      DSE_L1_LINT_CMD: ${DSE_L1_LINT_CMD:-}
      DSE_L1_TYPECHECK_CMD: ${DSE_L1_TYPECHECK_CMD:-}
      DSE_L1_BUILD_CMD: ${DSE_L1_BUILD_CMD:-}
      DSE_L1_TEST_CMD: ${DSE_L1_TEST_CMD:-node --check server.js}
      DSE_LITELLM_MASTER_KEY: ${DSE_LITELLM_MASTER_KEY:-sk-dse-local-dev-master-key}
      DSE_MODEL_GATEWAY_ALLOW_FIXTURE: ${DSE_MODEL_GATEWAY_ALLOW_FIXTURE:-1}
      # S7-c: imagem do sandbox com git+node (L1 `node --check` + finalize push
      # rodam via docker exec DENTRO do sandbox). dse-sandbox-base (WSC-E3-T4b).
      DSE_SANDBOX_IMAGE: ${DSE_SANDBOX_IMAGE:-dse-sandbox-base:wsc3}
      # S7 (Fase 5) — modo IN-PROCESS do PoC: o substrato do Coder (claude-agent-
      # sdk) roda NESTE processo de control-plane, então o código real vive no
      # workspace LOCAL (DSE_SANDBOX_STATE_DIR/<wi>/workspace) e NÃO no /workspace
      # do container efêmero (que fica vazio no docker-out-of-docker). Com isto,
      # L1 e finalize (git push) operam nesse workspace local via subprocesso.
      # Produção (agente DENTRO do container) NÃO seta esta flag → usa DockerExec.
      DSE_SANDBOX_INPROCESS: ${DSE_SANDBOX_INPROCESS:-1}
      # Credenciais do GitHub App injetadas do Vault no boot (ver make up-poc);
      # o finalize_pr (WS-E) roda aqui no orchestrator e precisa delas p/ abrir PR.
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      # Plano 08 §D (D1/D3/D4) — o trigger_preview roda NESTE worker.
      # KUBECONFIG interno (rede dse_net; gere com infra/k8s-local/
      # gen-kubeconfig-internal.sh após criar o cluster). O link do PR usa o
      # EXTERNAL_HOST: local = *.preview.localhost:8081 (Traefik do k3d
      # publicado no host). Para expor via túnel Cloudflare/VPS depois: só
      # trocar o template (ver infra/preview-exposure.md) — o Ingress segue o
      # mesmo hostname.
      KUBECONFIG: /app/infra/kubeconfig-internal.yaml
      DSE_PREVIEW_KUBE_CONTEXT: ${DSE_PREVIEW_KUBE_CONTEXT:-k3d-dse-preview}
      DSE_PREVIEW_EXTERNAL_HOST: ${DSE_PREVIEW_EXTERNAL_HOST:-http://{namespace}.preview.localhost:8081}
      DSE_PREVIEW_BUILD_IMAGE: ${DSE_PREVIEW_BUILD_IMAGE:-true}
      DSE_PREVIEW_REGISTRY_PUSH: ${DSE_PREVIEW_REGISTRY_PUSH:-localhost:5510}
      DSE_PREVIEW_REGISTRY_PULL: ${DSE_PREVIEW_REGISTRY_PULL:-k3d-dse-registry:5510}
      DSE_PREVIEW_APP_PORT: ${DSE_PREVIEW_APP_PORT:-80}
    ports:
      - "8900:8900"
    volumes:
      # Docker-outside-of-Docker: o worker (control plane confiavel) precisa
      # do socket do host para provisionar/destruir os containers de sandbox
      # via sandbox_runtime.docker_driver. Isto e' distinto e nao contradiz a
      # regra do proprio sandbox nao ter socket (P2/ADR-11) — o sandbox em si
      # nunca recebe este mount, so o processo que o cria.
      - /var/run/docker.sock:/var/run/docker.sock
      # Robustez (observado ao vivo): os workspaces/checkpoints das tarefas
      # (DSE_SANDBOX_STATE_DIR) viviam no /tmp DO CONTAINER — cada recreate do
      # worker destruia o estado de TODA tarefa em voo. Montado do host:
      # (a) sobrevive a restart/deploy do worker; (b) coere com o
      # docker-outside-of-docker — o daemon monta este MESMO path do host no
      # /workspace do sandbox, entao o container do sandbox passa a ver os
      # arquivos reais (antes via um diretorio vazio).
      - /tmp/dse-sandboxes:/tmp/dse-sandboxes
      # Plano 08 §D — preview: kubeconfig interno (ro) + o repo GitOps de
      # manifests (rw — o worker escreve; o dse-wse-gitserver serve o MESMO
      # path do host em ro para o Argo CD puxar).
      - ./infra/k8s-local/kubeconfig-internal.yaml:/app/infra/kubeconfig-internal.yaml:ro
      - ./services/validation/preview_repo:/app/services/validation/preview_repo
    depends_on:
      - postgres
      - temporal
    networks: [dse_net]
    restart: unless-stopped

networks:
  dse_net:
    external: true
