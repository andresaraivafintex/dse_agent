# WS-C — sandbox-runtime (exposes no port; called in-process by WS-B's
# Temporal worker) + egress-proxy (reserved port 8806).
#
# Dev mode (P7 boring-first): the egress-proxy image is a stock
# `python:3.11-slim` with the source code bind-mounted (`egress_proxy` depends
# only on stdlib + optional imports) — this avoids needing a build step to
# bring the service up in dev. Production should swap it for a dedicated image
# with a frozen `pip install -e services/egress-proxy` (see README).
#
# The `dse_sandbox_net` network is internal (no internet gateway) — every
# ephemeral sandbox container (created programmatically by
# `docker_driver.py`, not by this compose file) connects ONLY to it. The
# egress-proxy is the only participant connected both to `dse_sandbox_net`
# and to `dse_net` (which has Docker's default internet route), acting as the
# controlled bridge.
networks:
  # dse_sandbox_net is created programmatically by
  # sandbox_runtime/docker_driver.py (SANDBOX_NETWORK_NAME) the first time a
  # sandbox is provisioned — not by compose. It is referenced here as external
  # so the egress-proxy can attach to it without clashing with that dynamic
  # creation. Run `docker network create --internal dse_sandbox_net` manually
  # (or provision a test sandbox) before the first `make up` if it does not
  # exist yet.
  dse_sandbox_net:
    external: true

services:
  egress-proxy:
    image: python:3.11-slim
    container_name: dse_egress_proxy
    working_dir: /app
    command: ["python", "-m", "egress_proxy.server"]
    volumes:
      - ./services/egress-proxy:/app:ro
    environment:
      PYTHONPATH: /app
      DSE_EGRESS_PORT: "8806"
      DSE_EGRESS_TENANT_ID: "dev"
      DSE_EGRESS_MODEL_GATEWAY_HOST: "model-gateway"
      DSE_EGRESS_MODEL_GATEWAY_PORT: "4000"
      DSE_EGRESS_REPO_HOST: "github.com"
    ports:
      - "8806:8806"
    networks: [dse_net, dse_sandbox_net]
