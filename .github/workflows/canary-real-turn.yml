# Nightly REAL-turn canary (plan 09, Phase 4): one Coder turn against the
# model-gateway with a real provider, budget <= US$ 0.50. It activates once the
# repo has the DSE_CANARY_ANTHROPIC_KEY secret — without it the job exits as a
# no-op (the repo is still local-only; this file is the ready-made Phase 5 kit).
name: canary-real-turn

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 America/Sao_Paulo
  workflow_dispatch: {}

jobs:
  real-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAVE_KEY: ${{ secrets.DSE_CANARY_ANTHROPIC_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: No secret configured — no-op
        if: env.HAVE_KEY != 'true'
        run: echo "DSE_CANARY_ANTHROPIC_KEY missing; canary inert until Phase 5 configures secrets."

      - uses: actions/setup-python@v5
        if: env.HAVE_KEY == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked environment
        if: env.HAVE_KEY == 'true'
        run: python -m pip install -r requirements-ci.lock

      - name: Boot foundation + gateway (real provider)
        if: env.HAVE_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DSE_CANARY_ANTHROPIC_KEY }}
        run: |
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > secrets.env
          chmod 600 secrets.env
          docker compose -f docker-compose.yml -f docker-compose.wsd.yml up -d
          python scripts/migrate.py

      - name: Run canary turn (budget ≤ $0.50)
        if: env.HAVE_KEY == 'true'
        env:
          DSE_CANARY: "1"
          DSE_CANARY_BUDGET_USD: "0.50"
          DSE_CODER_SUBSTRATE: claude-agent
        run: >-
          python -m pytest services/sandbox-runtime/tests/test_canary_real_turn.py
          -q --no-header -rA
