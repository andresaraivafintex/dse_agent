name: CI

# WSF-E0 — pipeline de CI de plataforma. Roda lint (py_compile + ruff quando
# disponível) e pytest para CADA pacote/serviço do monorepo (packages/*,
# services/*), contra a infra REAL declarada em docker-compose.yml + todos
# os fragments docker-compose.ws*.yml presentes (nunca mocka Postgres/
# Temporal — P8/garantias de durabilidade são o próprio ponto do sistema).
#
# Gatilhos: todo PR e push em main. `workflow_dispatch` para reexecução
# manual (ex.: depois que um workstream publica um novo fragment de compose).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (py_compile + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: py_compile — todo arquivo .py de packages/ e services/
        run: |
          set -e
          files=$(find packages services -name '*.py' -not -path '*/.venv*/*' -not -path '*/node_modules/*')
          if [ -z "$files" ]; then
            echo "nenhum arquivo .py encontrado ainda — ok (monorepo em bootstrap)"
          else
            python3 -m py_compile $files
            echo "py_compile OK ($(echo "$files" | wc -l) arquivo(s))"
          fi

      - name: ruff check (se configurado em algum pacote/serviço)
        run: |
          pip install ruff --quiet
          # roda ruff de forma best-effort: não falha o job se um
          # pacote/serviço ainda não tiver configuração de ruff — mas
          # reporta findings de qualquer um que tenha.
          set +e
          ruff check packages services --exit-zero
          echo "ruff rodou em modo de relatório (--exit-zero) — não bloqueia o merge ainda; promover para bloqueante é uma decisão do arquiteto-chefe quando o repo estabilizar."

      - name: scan_for_plaintext_secrets — nenhum secret em manifest/env versionado
        run: |
          python3 scripts/scan_for_plaintext_secrets.py --root .

  test:
    name: pytest (packages/* + services/*, infra real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sobe infra da fundação + fragments de todos os workstreams
        run: |
          docker compose $(ls docker-compose.yml docker-compose.ws*.yml 2>/dev/null | sed 's/^/-f /') up -d postgres temporal redis vault
          echo "Aguardando Postgres..."
          until docker exec dse_postgres pg_isready -U dse -d dse >/dev/null 2>&1; do sleep 1; done
          echo "Aguardando Temporal..."
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/7233) >/dev/null 2>&1 && break
            sleep 1
          done
          echo "Aguardando Vault..."
          until curl -sf http://localhost:8200/v1/sys/health >/dev/null 2>&1; do sleep 1; done

      - name: Aplica migrações (packages/contracts precisa estar instalado antes por causa do script)
        env:
          DSE_DATABASE_URL: postgresql://dse:dse_dev_only@localhost:5432/dse
        run: |
          pip install psycopg2-binary --quiet
          python3 scripts/migrate.py

      - name: Instala todos os pacotes e serviços com pyproject.toml
        run: |
          python3 -m pip install --upgrade pip --quiet
          for p in packages/contracts packages/dse_audit packages/dse_identity; do
            if [ -d "$p" ]; then pip install -e "$p" --quiet; fi
          done
          for s in services/*; do
            if [ -f "$s/pyproject.toml" ]; then
              echo "installing $s"
              pip install -e "$s" --quiet || exit 1
            fi
          done
          pip install pytest --quiet

      - name: Rodar pytest em packages/ e services/
        env:
          DSE_DATABASE_URL: postgresql://dse:dse_dev_only@localhost:5432/dse
          DSE_AUDIT_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@localhost:5432/dse
          DSE_IDENTITY_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@localhost:5432/dse
          VAULT_ADDR: http://localhost:8200
          VAULT_DEV_ROOT_TOKEN: dse_dev_root
        run: |
          pytest -q packages services

      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: |
          docker compose $(ls docker-compose.yml docker-compose.ws*.yml 2>/dev/null | sed 's/^/-f /') logs --tail=200

      - name: Derruba a infra (isolada ao runner do CI — nunca rode isto localmente contra a infra compartilhada dos workstreams)
        if: always()
        run: |
          docker compose $(ls docker-compose.yml docker-compose.ws*.yml 2>/dev/null | sed 's/^/-f /') down -v
