name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  COMPOSE_FILE: docker-compose.yml:docker-compose.wsa.yml:docker-compose.wsb.yml:docker-compose.wsc.yml:docker-compose.wsd.yml:docker-compose.wse.yml:docker-compose.wsf.yml

jobs:
  quality:
    name: quality (compile, ruff, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked environment
        run: python -m pip install -r requirements-ci.lock

      - name: Verify test manifest is complete
        run: python scripts/test_matrix.py --list

      - name: Verify dependency lock is current
        run: |
          pip-compile --quiet --resolver=backtracking --strip-extras \
            --output-file=requirements-ci.lock requirements-ci.in
          git diff --exit-code -- requirements-ci.lock

      - name: Compile and lint (blocking)
        run: make lint

      - name: Scan tracked files for plaintext secrets
        run: python scripts/scan_for_plaintext_secrets.py --root .

      - name: Audit locked third-party dependencies
        run: pip-audit -r requirements-ci.lock --progress-spinner off

  contracts:
    name: contracts (typed activity boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked environment
        run: python -m pip install -r requirements-ci.lock

      - name: Run contract and literal-payload boundary tests
        run: >-
          python scripts/test_matrix.py
          --group contracts
          --group tooling
          --coverage
          --reports-dir test-results

      - name: Publish contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-contracts
          path: test-results/*.xml
          if-no-files-found: error

  suites:
    name: tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group:
          - packages
          - adapters
          - control-plane
          - runtime
          - validation
          - security
          - platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked environment
        run: python -m pip install -r requirements-ci.lock

      - name: Create isolated Docker network
        run: |
          if ! docker network inspect dse_sandbox_net >/dev/null 2>&1; then
            docker network create --internal dse_sandbox_net
          fi
          # Fragments ws* declaram dse_net como external (o merge do compose
          # herda essa marcação) — no runner limpo ela não existe ainda.
          if ! docker network inspect dse_net >/dev/null 2>&1; then
            docker network create dse_net
          fi

      - name: Start durable test dependencies
        run: |
          docker compose up -d postgres temporal redis vault
          until docker exec dse_postgres pg_isready -U dse -d dse >/dev/null 2>&1; do sleep 1; done
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/7233) >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs temporal
              exit 1
            fi
            sleep 1
          done
          until curl -sf http://localhost:8200/v1/sys/health >/dev/null; do sleep 1; done

      - name: Migrate the disposable runner database
        env:
          DSE_DATABASE_URL: postgresql://dse:dse_dev_only@localhost:5432/dse
        run: python scripts/migrate.py

      - name: Start validation dependencies
        if: matrix.group == 'validation'
        run: docker compose up -d garage wse-gitserver

      - name: Start security dependencies
        if: matrix.group == 'security'
        run: |
          if ! docker exec dse_postgres psql -U dse -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='dse_litellm'" | grep -q 1; then
            docker exec dse_postgres psql -U dse -d postgres -c \
              "CREATE DATABASE dse_litellm OWNER dse"
          fi
          docker compose up -d model-gateway-echo model-gateway-echo-b model-gateway egress-proxy
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:4000/health/liveliness >/dev/null; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              docker compose logs model-gateway model-gateway-echo model-gateway-echo-b
              exit 1
            fi
            sleep 2
          done

      - name: Start observability dependency
        if: matrix.group == 'platform'
        run: docker compose up -d otel-collector

      - name: Run suite group in a disposable schema
        env:
          DSE_TEST_RUN_ID: ci-${{ github.run_id }}-${{ matrix.group }}
          DSE_TEST_ADMIN_DATABASE_URL: postgresql://dse:dse_dev_only@localhost:5432/dse
          DSE_TEST_APP_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@localhost:5432/dse
          DSE_TEMPORAL_ADDRESS: localhost:7233
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: dse_dev_root
          VAULT_DEV_ROOT_TOKEN: dse_dev_root
        run: >-
          python scripts/with_test_database.py --
          python scripts/test_matrix.py
          --group "${{ matrix.group }}"
          --coverage
          --reports-dir test-results

      - name: Publish JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.group }}
          path: test-results/*.xml
          if-no-files-found: error

      - name: Dependency logs on failure
        if: failure()
        run: docker compose logs --tail=250

      - name: Remove disposable infrastructure
        if: always()
        run: docker compose down -v --remove-orphans

  helm:
    name: helm profiles and fail-closed policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.0.4

      # Suíte canônica do chart (tests/test_profiles.sh): dev renderiza; pilot
      # SEM digests DEVE falhar (fail-closed) e COM o fixture de digests passa
      # todas as asserções de postura. Os passos crus antigos invertiam essa
      # semântica (renderavam pilot sem o fixture e falhavam sempre).
      - name: Chart profile suite (lint + render + fail-closed posture)
        run: bash infra/helm/dse/tests/test_profiles.sh
