# Pipeline de release (plano 09, Fase 5): constrói TODAS as imagens, push no
# GHCR e emite o overlay de digests sha256 que o perfil estrito do Helm exige
# (imagem sem digest não renderiza pilot/production). Os builds NUNCA rodam na
# VPS (2 vCPU) — só aqui. A promoção dos gates pilotReadiness.* acontece neste
# pipeline, após as evidências (suítes + provas vivas), nunca à mão.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  PREFIX: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { name: orchestrator, dockerfile: services/orchestrator/Dockerfile }
          - { name: ingest-gateway, dockerfile: services/ingest-gateway/Dockerfile }
          - { name: adapter-slack, dockerfile: services/adapter-slack/Dockerfile }
          - { name: adapter-github, dockerfile: services/adapter-github/Dockerfile }
          - { name: adapter-jira, dockerfile: services/adapter-jira/Dockerfile }
          - { name: adapter-teams, dockerfile: services/adapter-teams/Dockerfile }
          - { name: platform, dockerfile: services/platform/Dockerfile }
          - { name: console-projector, dockerfile: services/console-projector/Dockerfile }
          - { name: agent-runner, dockerfile: services/sandbox-runtime/agent-runner/Dockerfile }
          # egress-proxy e model-gateway são Deployments próprios no chart
          # (validation NÃO — roda dentro do worker do orchestrator).
          - { name: egress-proxy, dockerfile: services/egress-proxy/Dockerfile }
          - { name: model-gateway, dockerfile: services/model-gateway/Dockerfile.proxy }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PREFIX }}/${{ matrix.image.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ matrix.image.name }}: \"${{ steps.push.outputs.digest }}\"" > "digests/${{ matrix.image.name }}.yaml"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}
          path: digests/

  digests-overlay:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Montar overlay de digests para o values de produção
        run: |
          {
            echo "# Gerado pelo release ${{ github.ref_name }} — cole nos values"
            echo "# do perfil pilot/production (o chart recusa imagem sem digest)."
            cat digests/*.yaml
          } > values-digests-${{ github.ref_name }}.yaml
          cat values-digests-*.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: values-digests
          path: values-digests-*.yaml
