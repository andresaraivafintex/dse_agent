# Release pipeline (plan 09, Phase 5): builds ALL the images, pushes to GHCR
# and emits the sha256 digest overlay that the strict Helm profile requires (an
# image without a digest does not render pilot/production). Builds NEVER run on
# the VPS (2 vCPU) — only here. Promotion of the pilotReadiness.* gates happens
# in this pipeline, after the evidence (suites + live proofs), never by hand.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  PREFIX: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { name: orchestrator, dockerfile: services/orchestrator/Dockerfile }
          - { name: ingest-gateway, dockerfile: services/ingest-gateway/Dockerfile }
          - { name: adapter-slack, dockerfile: services/adapter-slack/Dockerfile }
          - { name: adapter-github, dockerfile: services/adapter-github/Dockerfile }
          - { name: adapter-jira, dockerfile: services/adapter-jira/Dockerfile }
          - { name: adapter-teams, dockerfile: services/adapter-teams/Dockerfile }
          - { name: platform, dockerfile: services/platform/Dockerfile }
          - { name: console-projector, dockerfile: services/console-projector/Dockerfile }
          - { name: agent-runner, dockerfile: services/sandbox-runtime/agent-runner/Dockerfile }
          # egress-proxy and model-gateway are their own Deployments in the chart
          # (validation is NOT — it runs inside the orchestrator worker).
          - { name: egress-proxy, dockerfile: services/egress-proxy/Dockerfile }
          - { name: model-gateway, dockerfile: services/model-gateway/Dockerfile.proxy }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PREFIX }}/${{ matrix.image.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ matrix.image.name }}: \"${{ steps.push.outputs.digest }}\"" > "digests/${{ matrix.image.name }}.yaml"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}
          path: digests/

  digests-overlay:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Build the digest overlay for the production values
        run: |
          {
            echo "# Generated by release ${{ github.ref_name }} — paste into the values"
            echo "# of the pilot/production profile (the chart rejects images without a digest)."
            cat digests/*.yaml
          } > values-digests-${{ github.ref_name }}.yaml
          cat values-digests-*.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: values-digests
          path: values-digests-*.yaml
